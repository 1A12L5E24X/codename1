<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotfx</title>
<style>
/* A terminal app in the browser: one dark screen, monospace, thin square rules, one accent. */
:root {
  color-scheme: dark;
  --bg: #0d0f0e; --stage: #070808; --panel: #0d0f0e; --ink: #d4d7d5; --muted: #6f7672; --faint: #3b403d; --line: #262a28; --hover: #161918;
  --accent: #5fd787; --accent-ink: #07120b; --accent-soft: #15271c; --bad: #ff5f5f;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12.5px/1.5 var(--mono); }
button, input, select { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
u { text-decoration: none; color: var(--accent); }
.num, .status, .timeline span { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: 40px 1fr auto 24px; height: 100vh; }

/* ── buttons ────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0; height: 26px; padding: 0 10px; border: 1px solid var(--line);
  background: none; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible, .seg button:focus-visible, .look:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary u { color: inherit; text-decoration: underline; }
.btn.primary:hover { filter: brightness(1.1); color: var(--accent-ink); }
.btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.on u { color: inherit; }
.btn.ghost { border-color: transparent; }
.btn.small { height: 22px; padding: 0 8px; }
.divider { width: 1px; height: 18px; background: var(--line); }

/* ── header ─────────────────────────────────────────────────────────── */
header { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; color: var(--accent); margin-right: 8px; }
.file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 31px; min-width: 230px; z-index: 30; padding: 4px 0; display: none;
  background: var(--panel); border: 1px solid var(--faint); }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; width: 100%; gap: 12px; padding: 4px 12px; border: 0; background: none; text-align: left; cursor: pointer; }
.menu-list button:hover { background: var(--accent); color: var(--accent-ink); }
.menu-list button:hover small { color: var(--accent-ink); }
.menu-list small { color: var(--muted); margin-left: auto; font-size: inherit; }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ── stage ──────────────────────────────────────────────────────────── */
.stage { position: relative; overflow: hidden; background: var(--stage); }
.viewport { position: absolute; inset: 0; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas img { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.canvas.pixel img { image-rendering: pixelated; }
.canvas .checker { position: absolute; inset: 0; background: repeating-conic-gradient(#2a2a2a 0 25%, #1c1c1c 0 50%) 0 0 / 16px 16px; }
#before { display: none; }
.compare #before { display: block; }
.split { position: absolute; top: 0; bottom: 0; width: 0; display: none; z-index: 5; }
.compare .split { display: block; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--accent); }
.split i { position: absolute; top: 50%; left: -10px; width: 20px; height: 30px; margin-top: -15px; background: var(--accent); cursor: ew-resize; }
.split i::before { content: "‖"; color: var(--accent-ink); display: grid; place-items: center; height: 100%; font-style: normal; }
.tag { position: absolute; top: 10px; padding: 0 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); z-index: 6; display: none; }
.compare .tag { display: block; }
.tools { position: absolute; right: 10px; top: 10px; display: flex; z-index: 10; background: var(--bg); border: 1px solid var(--line); }
.tools .btn { border: 0; }
.tools .btn + .btn { border-left: 1px solid var(--line); }
.busy { position: absolute; left: 10px; top: 10px; z-index: 10; padding: 0 6px; background: var(--bg); border: 1px solid var(--line); color: var(--accent); display: none; }
.busy.on { display: block; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; }
.empty > div { border: 1px solid var(--faint); padding: 18px 22px; min-width: 420px; position: relative; }
.empty > div::before { content: " dotfx "; position: absolute; top: -9px; left: 14px; padding: 0 2px; background: var(--stage); color: var(--accent); }
.empty h1 { margin: 0 0 4px; font-size: inherit; font-weight: 700; }
.empty h1::before { content: "$ "; color: var(--accent); }
.empty p { margin: 0 0 16px; color: var(--muted); }
.empty .row { display: flex; gap: 8px; }
.dropping .stage::after { content: "[ drop to open ]"; position: absolute; inset: 10px; display: grid; place-items: center; z-index: 40;
  background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--accent); border: 1px dashed var(--accent); }
.webcam-bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 10; display: none; gap: 6px; align-items: center;
  padding: 3px 4px 3px 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.webcam .webcam-bar { display: flex; }
.webcam-bar .fps { color: var(--muted); min-width: 64px; }
.rec { display: none; color: var(--bad); font-weight: 700; }
.recording .rec { display: inline; }

/* ── bottom bar ─────────────────────────────────────────────────────── */
footer { border-top: 1px solid var(--line); padding: 6px 12px; display: grid; gap: 6px; min-width: 0; }
.timeline { display: none; align-items: center; gap: 12px; color: var(--muted); }
.timeline.on { display: flex; }
.timeline input { flex: 1; }
.bar-row { display: flex; align-items: center; gap: 16px; min-height: 28px; min-width: 0; }
.look-pick { display: flex; align-items: center; gap: 8px; }
.look-pick label, .quick .field label { color: var(--muted); }
.look-pick select { height: 26px; width: 180px; padding: 0 6px; border: 1px solid var(--line); background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { height: 24px; padding: 0 10px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.quick { display: flex; align-items: center; gap: 16px; min-width: 0; overflow: hidden; }
.quick .field { display: flex; align-items: center; gap: 8px; padding: 0; }
.quick input[type=range] { width: 80px; flex: none; }
.quick .num { width: 52px; }
.quick .text, .quick .none-tag { display: none; }
.status { flex: 0 1 auto; max-width: 34%; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .err { color: var(--bad); }
/* the key line, like nano or htop */
.keys { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--hover); color: var(--muted); white-space: nowrap; overflow: hidden; }
.keys b { color: var(--bg); background: var(--muted); padding: 0 4px; font-weight: 400; margin-right: 4px; }

/* ── side panel ─────────────────────────────────────────────────────── */
.drawer { position: fixed; top: 40px; right: 0; bottom: 24px; width: 350px; z-index: 20; background: var(--panel); border-left: 1px solid var(--faint);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .12s linear; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.drawer-head .seg { flex: 1; } .drawer-head .seg button { flex: 1; }
.pane { flex: 1; overflow: auto; display: none; }
.pane.on { display: block; }
.pane::-webkit-scrollbar { width: 8px; } .pane::-webkit-scrollbar-thumb { background: var(--faint); }
.pane-pad { padding: 10px 12px; }
.search { width: 100%; height: 26px; padding: 0 8px; border: 1px solid var(--line); background: var(--bg); outline: none; }
.search:focus { border-color: var(--accent); }
.drawer-foot { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.look-group { margin: 2px 0 8px; color: var(--muted); }
.look-group::before { content: "── "; color: var(--faint); }
.look-group:not(:first-child) { margin-top: 16px; }
.looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.look { padding: 0; border: 0; background: none; cursor: pointer; text-align: left; min-width: 0; outline: none; }
.look .thumb { aspect-ratio: 1; overflow: hidden; background: var(--stage); border: 1px solid var(--line); }
.look img { width: 100%; height: 100%; object-fit: cover; display: block; }
.look span { display: block; margin-top: 3px; padding: 0 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.look:hover .thumb { border-color: var(--muted); }
.look.on .thumb { border-color: var(--accent); }
.look.on span { background: var(--accent); color: var(--accent-ink); }
details.grp { border-bottom: 1px solid var(--line); }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::before { content: "▸"; color: var(--muted); }
details.grp[open] summary::before { content: "▾"; color: var(--accent); }
details.grp summary:hover { background: var(--hover); }
details.grp summary .count { margin-left: auto; color: var(--accent); font-weight: 400; }
details.grp summary .count:not(:empty)::before { content: "* "; }
.grp-body { padding: 0 12px 8px 30px; }
.field { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; padding: 2px 0; }
.field label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field.changed label { color: var(--accent); }
.field .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.num, .text, .field select { height: 22px; padding: 0 5px; border: 1px solid var(--line); background: var(--bg); outline: none; }
.num { width: 58px; text-align: right; -moz-appearance: textfield; } .text, .field select { width: 100%; min-width: 0; }
.num::-webkit-inner-spin-button { display: none; }
.num:focus, .text:focus, .field select:focus { border-color: var(--accent); }
input[type=color] { width: 22px; height: 22px; padding: 2px; border: 1px solid var(--line); background: var(--bg); flex: none; cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } input[type=color]::-webkit-color-swatch { border: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 16px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--faint); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 14px; margin-top: -6px; background: var(--ink); }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { background: var(--accent); }
input[type=range]::-moz-range-track { height: 2px; background: var(--faint); }
input[type=range]::-moz-range-thumb { width: 8px; height: 14px; border: 0; border-radius: 0; background: var(--ink); }
.switch { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); }
.switch::before { content: "[ ] off"; }
.switch.on { color: var(--accent); } .switch.on::before { content: "[x] on"; }
.none-tag { color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; }
input[type=checkbox] { accent-color: var(--accent); }

/* ── messages ───────────────────────────────────────────────────────── */
.toasts { position: fixed; right: 12px; top: 80px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 50; }
.toast { max-width: 520px; padding: 6px 12px; background: var(--bg); border: 1px solid var(--faint); border-left: 3px solid var(--accent); }
.toast.err { border-left-color: var(--bad); color: var(--bad); }
.toast ul { margin: 4px 0 0; padding-left: 0; list-style: none; color: var(--muted); } .toast li::before { content: "  · "; }
.toast code { word-break: break-all; color: var(--accent); }
.toast .bar { height: 6px; background: var(--line); margin-top: 6px; overflow: hidden; }
.toast .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

@media (max-width: 860px) { .hide-s { display: none !important; } header { padding: 0 8px; } footer { padding: 6px 8px; }
  .bar-row, .quick { flex-wrap: wrap; gap: 6px 12px; } .drawer { width: 100%; } .empty > div { min-width: 0; margin: 0 12px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="brand">dotfx</span>
    <span class="file" id="file"></span>
    <span class="spacer"></span>
    <button class="btn" id="openBtn" title="Open a photo or video (O)"><u>O</u>pen</button>
    <button class="btn" id="camBtn" title="Use the webcam (W)"><u>W</u>ebcam</button>
    <button class="btn hide-s" id="matchBtn" title="Copy the look of a reference image (M)"><u>M</u>atch reference</button>
    <span class="divider hide-s"></span>
    <button class="btn ghost hide-s" id="cmdBtn" title="Copy the equivalent command line">Copy command</button>
    <button class="btn ghost hide-s" id="saveBtn" title="Download these settings as a preset file">Save preset</button>
    <button class="btn" id="settingsBtn" title="Looks and settings (S)"><u>S</u>ettings</button>
    <div class="menu" id="exportMenu">
      <button class="btn primary" id="exportBtn" title="Export (E)"><u>E</u>xport</button>
      <div class="menu-list" id="exportList"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <input type="file" id="refInput" accept="image/*" hidden>
  </header>

  <section class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas"><div class="checker"></div><img id="after" alt=""><img id="before" alt=""></div>
      <div class="split" id="split"><i></i></div>
      <div class="tag" id="tagB" style="left:12px">Original</div><div class="tag" id="tagA" style="right:150px">Result</div>
    </div>
    <div class="busy" id="busy"><span id="busyText">Rendering…</span></div>
    <div class="tools">
      <button class="btn small" id="compareBtn" title="Compare with the original (C)"><u>C</u>ompare</button>
      <button class="btn small" data-zoom="fit" title="Fit to window (F)"><u>F</u>it</button>
      <button class="btn small" data-zoom="1" title="Actual size (1)">100%</button>
      <button class="btn small" data-zoom="2" title="200% (2)">200%</button>
    </div>
    <div class="webcam-bar"><span class="rec" id="recDot">● Recording</span><span class="fps" id="camFps">—</span>
      <button class="btn small" id="snapBtn">Snapshot</button><button class="btn small" id="recBtn">Record</button>
      <button class="btn small" id="camStop">Stop camera</button></div>
    <div class="empty" id="empty"><div>
      <h1>no input</h1><p>Drop a photo or video here (PNG, JPEG, WebP, MP4, MOV…), or:</p>
      <div class="row"><button class="btn primary" id="openBtn2">Open file</button>
        <button class="btn" id="camBtn2">Use webcam</button>
        <button class="btn" id="sampleBtn">Try a sample</button></div>
    </div></div>
    <video id="video" playsinline muted hidden></video>
    <canvas id="grab" hidden></canvas>
  </section>

  <footer>
    <div class="timeline" id="timeline"><input type="range" id="time" min="0" max="1" step="0.04" value="0"><span id="timeLabel">0.0 / 0.0 s</span></div>
    <div class="bar-row">
      <div class="look-pick"><label for="lookSelect">Look</label><select id="lookSelect"></select></div>
      <div class="seg" id="effectSeg"><button data-v="halftone">Halftone</button><button data-v="dither">Dither</button></div>
      <div class="quick" id="quick"></div>
      <span class="spacer"></span>
      <span class="status" id="status"><span id="st-msg"></span> <span id="st-render"></span> <span id="st-size"></span></span>
    </div>
  </footer>
  <div class="keys"><span><b>O</b>Open</span><span><b>W</b>Webcam</span><span><b>S</b>Settings</span><span><b>E</b>Export</span>
    <span><b>C</b>Compare</span><span><b>F</b>Fit</span><span><b>1</b><b>2</b>Zoom</span><span><b>←</b><b>→</b>Looks</span><span><b>/</b>Search</span><span><b>Esc</b>Close</span></div>
</div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="seg"><button class="tab on" data-pane="looks">Looks</button><button class="tab" data-pane="settings">Adjust</button></div>
    <button class="btn ghost small" id="drawerClose" title="Close (Esc)">Close</button>
  </div>
  <div class="pane on" id="pane-looks"><div class="pane-pad" id="looks"></div></div>
  <div class="pane" id="pane-settings">
    <div class="pane-pad"><input class="search" id="search" placeholder="Search settings"></div>
    <div id="settings"></div>
  </div>
  <div class="drawer-foot"><button class="btn small" id="resetBtn" title="Restore the look's values">Reset changes</button></div>
</aside>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Dotfx-Token": TOKEN, ...(opts.headers || {}) } });
async function apiJSON(path, body) {
  const r = await api(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const GROUP_NAMES = { effect: "Effect", size: "Size", tone: "Tone", colors: "Colors", halftone: "Halftone screen",
  dither: "Dither", texture: "Print texture", mask: "Mask", clipping: "Paper clipping" };
const HIDE = { halftone: "dither", dither: "halftone" };
const NUMBER_ONLY = new Set(["seed", "width", "height"]);
const PRESET_GROUPS = [["Reference looks", n => n.startsWith("newsprint") || n.startsWith("sky-dither")],
  ["Black and white", n => n.startsWith("bw-")], ["More looks", () => true]];
const QUICK_LABELS = { cells: "Dot size", cell: "Dot size", pixel: "Pixel size" };
const human = name => { const s = name.replace(/_/g, " "); return s[0].toUpperCase() + s.slice(1); };
const ACRONYMS = { bw: "B&W", cmyk: "CMYK", rgb: "RGB", cga: "CGA", led: "LED", pico8: "PICO-8", gameboy: "Game Boy", xerox: "Photocopy" };
const lookName = n => human(n.split("-").map(w => ACRONYMS[w] || w).join(" "));

const S = { schema: null, presets: [], media: null, look: {}, base: {}, preset: null, time: 0, thumbs: {},
  zoom: "fit", z: 1, x: 0, y: 0, nat: [0, 0], compare: false, split: 0.5, cam: null };

// ---- toasts and status -------------------------------------------------------------------
function toast(html, kind = "", ms = 3500) {
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = html;
  $("#toasts").append(t); if (ms) setTimeout(() => t.remove(), ms); return t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function status(msg, kind = "") { const el = $("#st-msg"); el.textContent = msg; el.className = kind; }
function busy(on, text = "Rendering…") { $("#busy").classList.toggle("on", on); $("#busyText").textContent = text; }

// ---- settings model -----------------------------------------------------------------------
const defaults = () => Object.fromEntries(S.schema.fields.map(f => [f.name, f.default]));
function changed(look = S.look) {
  const d = defaults(); const out = {};
  for (const k in look) if (look[k] !== d[k]) out[k] = look[k];
  return out;
}
function applyPreset(name, extra = null) {
  const p = S.presets.find(p => p.name === name);
  S.preset = name; S.base = { ...defaults(), ...(p ? p.settings : extra || {}) }; S.look = { ...S.base };
  buildSettings(); markLooks(); scheduleRender();
}
function setValue(name, v) {
  S.look[name] = v; refreshField(name);
  if (name === "effect" || name === "cells") buildSettings();
  scheduleRender();
}

// ---- settings: the side panel, plus a few in the bottom bar ---------------------------------
function quickNames() {
  const size = S.look.cells ? "cells" : S.look.effect === "dither" ? "pixel" : "cell";
  return [size, "contrast", "brightness", "ink", "paper"];
}
function buildSettings() {
  const root = $("#settings"); root.innerHTML = "";
  const q = $("#search").value.trim().toLowerCase();
  const hidden = HIDE[S.look.effect];
  const groups = {};
  for (const f of S.schema.fields) {
    if (f.group === hidden || f.name === "effect") continue;
    if (q && !(f.name.includes(q.replace(/ /g, "_")) || f.help.toLowerCase().includes(q))) continue;
    (groups[f.group] ||= []).push(f);
  }
  for (const [g, list] of Object.entries(groups)) {
    const det = document.createElement("details"); det.className = "grp"; det.dataset.group = g;
    det.open = q !== "" || ["tone", "colors", "halftone", "dither"].includes(g);
    det.innerHTML = `<summary>${GROUP_NAMES[g] || human(g)}<span class="count"></span></summary><div class="grp-body"></div>`;
    for (const f of list) det.querySelector(".grp-body").append(fieldEl(f));
    root.append(det);
  }
  const quick = $("#quick"); quick.innerHTML = "";
  for (const n of quickNames()) { const f = S.schema.fields.find(f => f.name === n); if (f) quick.append(fieldEl(f, QUICK_LABELS[n])); }

function layout() {

}

  c.classList.toggle("pixel", S.z >= 1.5);

(() => {

    const z = Math.min(Math.max(S.z * Math.exp(-e.deltaY * 0.0015), 0.05), 16); zoomTo(z, e.clientX - r.left, e.clientY - r.top); }, { passive: false });

    const r = vp.getBoundingClientRect();
    const onSplit = S.compare && e.target.closest(".split");
    drag = { x: e.clientX, y: e.clientY, ox: S.x, oy: S.y, split: !!onSplit, r };
    vp.setPointerCapture(e.pointerId); vp.classList.add("drag"); });

      if (!r.ok) throw new Error((await r.json()).error);

      const now = performance.now(); S.cam && S.cam.frames.push(now - last); last = now;
      if (S.cam && S.cam.frames.length > 10) S.cam.frames.shift();
      const avg = S.cam ? S.cam.frames.reduce((a, b) => a + b, 0) / S.cam.frames.length : 0;

  }
}

  const img = $("#after"); recCanvas = document.createElement("canvas");
  recCanvas.width = img.naturalWidth - img.naturalWidth % 2; recCanvas.height = img.naturalHeight - img.naturalHeight % 2;
  const rec = new MediaRecorder(recCanvas.captureStream(20), { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
  cam.chunks = []; rec.ondataavailable = e => cam.chunks.push(e.data);
  rec.onstop = () => { download(new Blob(cam.chunks, { type: "video/webm" }), `dotfx-live-${Date.now()}.webm`);
    cam.recorder = null; $("#stage").classList.remove("recording"); $("#recBtn").textContent = "Record"; toast("Recording saved."); };
  rec.start(500); cam.recorder = rec; $("#stage").classList.add("recording"); $("#recBtn").textContent = "Stop recording";
};

// ---- keyboard -------------------------------------------------------------------------------------
addEventListener("keydown", e => {
  if (e.key === "Escape") { toggleDrawer(false); $("#exportMenu").classList.remove("open"); document.activeElement.blur(); return; }
  if (e.target.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "f") setZoom("fit"); else if (k === "1") setZoom("1"); else if (k === "2") setZoom("2");
  else if (k === "c") toggleCompare(); else if (k === "o") $("#fileInput").click();
  else if (k === "w") (S.cam ? stopCam() : startCam());
  else if (k === "m") $("#refInput").click();
  else if (k === "s") toggleDrawer();
  else if (k === " " && S.cam) { e.preventDefault(); snapshot(); }
  else if (k === "e") { e.stopPropagation(); $("#exportMenu").classList.toggle("open"); }
  else if (k === "/") { e.preventDefault(); toggleDrawer(true, "settings"); $("#search").focus(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const names = lookOrder().flatMap(([, n]) => n);
    const i = names.indexOf(S.preset); applyPreset(names[(i + (e.key === "ArrowRight" ? 1 : -1) + names.length) % names.length]); }
});

// ---- start ---------------------------------------------------------------------------------------
(async () => {
  try {
    [S.schema, S.presets] = await Promise.all([apiJSON("/api/schema"), apiJSON("/api/presets")]);
  } catch (e) { document.body.innerHTML = `<p style="padding:40px">dotfx can't reach its engine (${esc(e.message)}). Open the link printed in your terminal.</p>`; return; }
  const init = await apiJSON("/api/state");
  S.preset = init.preset; S.base = { ...defaults(), ...(S.presets.find(p => p.name === init.preset) || { settings: {} }).settings };
  S.look = { ...defaults(), ...init.settings };
  if (!init.preset && Object.keys(init.settings).length) S.base = { ...S.look };
  if (!init.preset && !Object.keys(init.settings).length) { const p = S.presets.find(p => p.name === "newsprint"); S.preset = "newsprint"; S.base = { ...defaults(), ...p.settings }; S.look = { ...S.base }; }
  buildSettings(); buildLooks(); buildExportMenu(); setMedia(init.media);
  if (init.mode === "webcam" || location.hash === "#webcam") startCam();
})();
</script>
</body>
