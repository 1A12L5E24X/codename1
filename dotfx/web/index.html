<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotfx</title>
<style>
/* Two themes, one shape: "paper" (bright risograph terminal) and "neon" (dark, still loud). */
:root {
  --paper: #fff7e4; --paper2: #fff0c9; --card: #fffdf6; --ink: #1d1b16; --muted: #7b7262; --soft: #eadfc2;
  --pink: #ff4fa3; --yellow: #ffd60a; --blue: #2f6bff; --mint: #12c59a; --orange: #ff7a1a; --purple: #8a5cff;
  --good: #12a37f; --bad: #e8344e; --dots: #1d1b1614; --shadow: #1d1b16;
  --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="neon"] {
  --paper: #100e1d; --paper2: #1a1730; --card: #15132a; --ink: #f6f1ff; --muted: #9d95cf; --soft: #2a2650;
  --pink: #ff5cc0; --yellow: #ffe14d; --blue: #4d8dff; --mint: #2ef2b8; --orange: #ff9340; --purple: #a585ff;
  --good: #2ef2b8; --bad: #ff5c7a; --dots: #ffffff10; --shadow: #ff5cc0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 13px/1.45 var(--mono); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--yellow); color: #1d1b16; }

.app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 360px 1fr; height: 100vh; gap: 0; }

/* ── title bar + prompt ─────────────────────────────────────────────── */
header { grid-column: 1 / 3; border-bottom: 3px solid var(--ink); background: var(--card); }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px; }
.lights { display: flex; gap: 6px; }
.lights i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
.lights i:nth-child(1) { background: var(--pink); } .lights i:nth-child(2) { background: var(--yellow); } .lights i:nth-child(3) { background: var(--mint); }
.brand { font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.brand .dots { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; }
.brand .dots b { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.brand .dots b:nth-child(2) { transform: scale(.75); } .brand .dots b:nth-child(3) { transform: scale(.45); }
.brand .dots b:nth-child(4) { transform: scale(.75); } .brand .dots b:nth-child(5) { transform: scale(.5); }
.brand .dots b:nth-child(6) { transform: scale(.3); } .brand .dots b:nth-child(7) { transform: scale(.45); }
.brand .dots b:nth-child(8) { transform: scale(.3); } .brand .dots b:nth-child(9) { transform: scale(.15); }
.file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
.file b { color: var(--ink); }
.spacer { flex: 1; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 4px 14px 10px; flex-wrap: wrap; }
.prompt { display: flex; align-items: center; gap: 0; margin: 0 14px 10px; padding: 8px 12px; border: 2px solid var(--ink);
  border-radius: 8px; background: var(--ink); color: #f8f3e6; cursor: copy; overflow: hidden; white-space: nowrap; }
:root[data-theme="neon"] .prompt { background: #07060f; color: var(--ink); }
.prompt .ps { color: var(--mint); margin-right: 8px; } .prompt .tilde { color: var(--blue); filter: brightness(1.5); }
.prompt code { font: inherit; overflow: hidden; text-overflow: ellipsis; }
.prompt .c-cmd { color: var(--pink); font-weight: 700; } .prompt .c-file { color: #8fb6ff; }
.prompt .c-flag { color: var(--yellow); } .prompt .c-val { color: #f8f3e6; } .prompt .c-preset { color: var(--mint); }
:root[data-theme="neon"] .prompt .c-val { color: var(--ink); }
.cursor { display: inline-block; width: 8px; height: 15px; margin-left: 2px; background: var(--yellow); animation: blink 1.05s steps(2) infinite; vertical-align: -2px; flex: none; }
.prompt .hint { margin-left: auto; padding-left: 14px; color: #a39a86; font-size: 11px; }
@keyframes blink { 50% { opacity: 0; } }

/* ── keycap buttons ─────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border: 2px solid var(--ink);
  border-radius: 8px; background: var(--card); box-shadow: 3px 3px 0 var(--shadow); white-space: nowrap; font-weight: 600;
  transition: transform .06s, box-shadow .06s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn:active, .btn.on { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn .key { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border: 2px solid var(--ink);
  border-radius: 5px; background: #fff8e7; color: #1d1b16; font-size: 11px; font-weight: 800; }
.btn.pink { background: var(--pink); color: #1d1b16; } .btn.yellow { background: var(--yellow); color: #1d1b16; }
.btn.blue { background: var(--blue); color: #fff; } .btn.mint { background: var(--mint); color: #1d1b16; }
.btn.orange { background: var(--orange); color: #1d1b16; } .btn.purple { background: var(--purple); color: #fff; }
.btn.on { outline: 3px dashed var(--ink); outline-offset: 2px; }
.btn.small { height: 28px; font-size: 12px; padding: 0 9px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 44px; min-width: 240px; z-index: 30; padding: 6px; display: none;
  background: var(--card); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 5px 5px 0 var(--shadow); }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; width: 100%; justify-content: space-between; gap: 12px; padding: 8px 10px; border: 0;
  background: none; border-radius: 6px; text-align: left; font-weight: 600; }
.menu-list button::before { content: "›"; color: var(--pink); margin-right: 4px; }
.menu-list button:hover { background: var(--yellow); color: #1d1b16; }
.menu-list small { color: var(--muted); font-weight: 400; margin-left: auto; }
.menu-list hr { border: 0; border-top: 2px dashed var(--soft); margin: 5px 4px; }

/* ── panels ─────────────────────────────────────────────────────────── */
aside { grid-row: 2; display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 14px 14px; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 3px solid var(--ink); border-radius: 12px;
  background: var(--card); box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; }
.tabs { display: flex; border-bottom: 3px solid var(--ink); }
.tab { flex: 1; padding: 9px 6px; border: 0; background: var(--paper2); font-weight: 800; letter-spacing: .5px; }
.tab + .tab { border-left: 3px solid var(--ink); }
.tab.on { background: var(--yellow); color: #1d1b16; }
.tab::before { content: "[ "; color: var(--muted); } .tab::after { content: " ]"; color: var(--muted); }
.tab.on::before, .tab.on::after { color: #1d1b16; }
.pane { flex: 1; overflow: auto; padding: 12px; display: none; }
.pane.on { display: block; }
.pane::-webkit-scrollbar { width: 12px; } .pane::-webkit-scrollbar-thumb { background: var(--ink); border: 3px solid var(--card); border-radius: 9px; }

.group-title { margin: 16px 0 9px; font-weight: 800; font-size: 12px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.group-title::before { content: "──┤"; color: var(--muted); } .group-title::after { content: "├" ; color: var(--muted); }
.group-title span { padding: 1px 8px; border: 2px solid var(--ink); border-radius: 6px; background: var(--c, var(--pink)); color: #1d1b16; }
.group-title:first-child { margin-top: 2px; }
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.look { position: relative; padding: 0; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; background: var(--paper2);
  aspect-ratio: 1 / 1; box-shadow: 3px 3px 0 var(--shadow); transition: transform .12s; }
.look img { width: 100%; height: 100%; object-fit: cover; display: block; }
.look span { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 1px 6px; border: 2px solid var(--ink);
  border-radius: 5px; background: var(--c, var(--yellow)); color: #1d1b16; font-size: 11px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.look:hover { transform: rotate(-1.5deg) scale(1.03); }
.look:nth-child(even):hover { transform: rotate(1.5deg) scale(1.03); }
.look.on { outline: 3px solid var(--pink); outline-offset: 3px; }
.look.on::after { content: "★"; position: absolute; top: 5px; right: 6px; width: 22px; height: 22px; display: grid; place-items: center;
  border: 2px solid var(--ink); border-radius: 50%; background: var(--pink); color: #1d1b16; font-size: 12px; }
.look .ph { width: 100%; height: 100%; background: radial-gradient(circle, var(--soft) 2px, transparent 2.5px) 0 0 / 10px 10px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.search { width: 100%; height: 34px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper);
  outline: none; }
.search:focus { box-shadow: 3px 3px 0 var(--pink); }
.seg { display: grid; grid-auto-flow: column; gap: 0; margin: 12px 0 4px; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; padding: 7px; background: var(--paper2); font-weight: 800; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--blue); color: #fff; }
details.grp { margin-top: 10px; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer;
  background: var(--c, var(--pink)); color: #1d1b16; font-weight: 800; letter-spacing: .5px; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::before { content: "+"; display: inline-grid; place-items: center; width: 16px; height: 16px; border: 2px solid #1d1b16;
  border-radius: 4px; font-size: 11px; background: #fff8; }
details.grp[open] summary::before { content: "−"; }
details.grp[open] summary { border-bottom: 2px solid var(--ink); }
details.grp summary .count { margin-left: auto; padding: 0 6px; border-radius: 4px; background: #1d1b16; color: var(--yellow); font-size: 11px; }
details.grp summary .count:empty { display: none; }
.grp-body { padding: 4px 8px 6px; }
.field { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 6px 10px; padding: 5px 2px; border-bottom: 1px dashed var(--soft); }
.field:last-child { border-bottom: 0; }
.field label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
.field.changed label { color: var(--ink); font-weight: 700; }
.field.changed label::before { content: "*"; color: var(--pink); font-weight: 900; cursor: pointer; }
.field .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.num, .text, .field select { height: 28px; padding: 0 7px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); outline: none; }
.num { width: 58px; font-size: 12px; } .text, .field select { width: 100%; }
.num:focus, .text:focus, .field select:focus { box-shadow: 2px 2px 0 var(--pink); }
input[type=color] { width: 32px; height: 28px; padding: 2px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); }
/* chunky "block" sliders */
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 18px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border: 2px solid var(--ink); border-radius: 4px;
  background: repeating-linear-gradient(90deg, var(--soft) 0 6px, var(--paper) 6px 8px); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 20px; margin-top: -8px; border: 2px solid var(--ink);
  border-radius: 3px; background: var(--c, var(--pink)); box-shadow: 2px 2px 0 var(--ink); }
input[type=range]::-moz-range-track { height: 6px; border: 2px solid var(--ink); border-radius: 4px; background: var(--soft); }
input[type=range]::-moz-range-thumb { width: 12px; height: 18px; border: 2px solid var(--ink); border-radius: 3px; background: var(--c, var(--pink)); }
.switch { position: relative; width: 58px; height: 26px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper2);
  font-size: 11px; font-weight: 800; text-align: right; padding: 0 7px; }
.switch::before { content: "off"; color: var(--muted); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border: 2px solid var(--ink);
  border-radius: 3px; background: var(--card); transition: left .12s; }
.switch.on { background: var(--mint); text-align: left; color: #1d1b16; } .switch.on::before { content: "on"; color: #1d1b16; }
.switch.on::after { left: 35px; background: #1d1b16; }
.none-tag { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.side-foot { display: flex; gap: 8px; padding: 12px 0 0; }
.side-foot .btn { flex: 1; justify-content: center; }

/* ── stage ──────────────────────────────────────────────────────────── */
.stage { grid-row: 2; position: relative; overflow: hidden; margin: 14px 14px 14px 4px; border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 5px 5px 0 var(--shadow); background: radial-gradient(circle, var(--dots) 1.6px, transparent 2px) 0 0 / 14px 14px, var(--paper2); }
.viewport { position: absolute; inset: 0; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; outline: 3px solid var(--ink); box-shadow: 10px 10px 0 var(--pink); }
.canvas img { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.canvas.pixel img { image-rendering: pixelated; }
.canvas .checker { position: absolute; inset: 0; background: repeating-conic-gradient(#d8d8d8 0 25%, #f4f4f4 0 50%) 0 0 / 16px 16px; }
#before { display: none; }
.compare #before { display: block; }
.split { position: absolute; top: 0; bottom: 0; width: 0; display: none; z-index: 5; }
.compare .split { display: block; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2px; width: 4px; background: var(--yellow); border-left: 1px solid #1d1b16; border-right: 1px solid #1d1b16; }
.split i { position: absolute; top: 50%; left: -20px; width: 40px; height: 30px; margin-top: -15px; border: 2px solid #1d1b16; border-radius: 6px;
  background: var(--yellow); color: #1d1b16; display: grid; place-items: center; font-style: normal; font-weight: 900; cursor: ew-resize; box-shadow: 3px 3px 0 #1d1b16; }
.tag { position: absolute; bottom: 14px; padding: 2px 9px; border: 2px solid #1d1b16; border-radius: 6px; font-weight: 800; z-index: 6; display: none; color: #1d1b16; }
#tagB { background: var(--card); } #tagA { background: var(--pink); }
.compare .tag { display: block; }
.tools { position: absolute; right: 14px; top: 14px; display: flex; gap: 7px; z-index: 10; }
.busy { position: absolute; left: 14px; top: 14px; z-index: 10; display: none; align-items: center; gap: 8px; padding: 5px 11px;
  border: 2px solid var(--ink); border-radius: 8px; background: var(--yellow); color: #1d1b16; font-weight: 800; box-shadow: 3px 3px 0 var(--shadow); }
.busy.on { display: flex; }
.timeline { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(660px, 84%); z-index: 10; display: none;
  align-items: center; gap: 10px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: 4px 4px 0 var(--shadow); }
.timeline.on { display: flex; }
.timeline input { --c: var(--blue); }
.timeline span { font-weight: 700; min-width: 108px; text-align: right; }
.timeline b { color: var(--pink); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 4; }
.empty .card { padding: 30px 38px 32px; border: 3px solid var(--ink); border-radius: 16px; background: var(--card); max-width: 560px;
  box-shadow: 8px 8px 0 var(--pink); transform: rotate(-.6deg); }
.bigdots { display: grid; grid-template-columns: repeat(11, 14px); gap: 4px; justify-content: center; margin: 4px auto 14px; }
.bigdots b { width: 14px; height: 14px; border-radius: 50%; background: var(--c); transform: scale(var(--s)); animation: bob 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes bob { 50% { transform: scale(calc(var(--s) * .55)); } }
.empty h1 { margin: 6px 0 4px; font-size: 22px; } .empty h1 .cursor { height: 20px; width: 11px; }
.empty p { margin: 0 0 20px; color: var(--muted); }
.empty .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.dropping .stage::after { content: "› drop it like it's dot"; position: absolute; inset: 12px; border: 4px dashed var(--ink); border-radius: 12px;
  display: grid; place-items: center; font-size: 22px; font-weight: 900; background: var(--yellow); z-index: 40; color: #1d1b16; }
.webcam-bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: none; gap: 9px; align-items: center;
  padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: 4px 4px 0 var(--shadow); white-space: nowrap; }
.webcam .webcam-bar { display: flex; }
.rec { display: none; padding: 1px 7px; border: 2px solid #1d1b16; border-radius: 5px; background: var(--bad); color: #fff; font-weight: 900; }
.recording .rec { display: inline; animation: blink 1s steps(2) infinite; }

/* ── status line (tmux-ish) ─────────────────────────────────────────── */
footer { grid-column: 1 / 3; display: flex; align-items: stretch; height: 30px; border-top: 3px solid var(--ink); background: var(--card); font-size: 12px; font-weight: 700; }
footer > span { display: flex; align-items: center; padding: 0 12px; border-right: 2px solid var(--ink); white-space: nowrap; }
footer .seg-mode { background: var(--pink); color: #1d1b16; letter-spacing: 1px; }
footer .seg-preset { background: var(--yellow); color: #1d1b16; }
footer .seg-render { background: var(--mint); color: #1d1b16; }
footer .seg-size { color: var(--ink); }
footer .seg-msg { flex: 1; color: var(--muted); border-right: 0; overflow: hidden; text-overflow: ellipsis; }
footer .seg-msg.err { color: var(--bad); }
footer .seg-keys { border-right: 0; border-left: 2px solid var(--ink); color: var(--muted); font-weight: 400; }
footer .seg-keys b { color: var(--ink); }

/* ── toasts ─────────────────────────────────────────────────────────── */
.toasts { position: fixed; right: 18px; top: 128px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.toast { min-width: 280px; max-width: 440px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card);
  box-shadow: 4px 4px 0 var(--shadow); animation: pop .18s ease-out; }
.toast::before { content: "› "; color: var(--pink); font-weight: 900; }
.toast.ok { background: var(--mint); color: #1d1b16; } .toast.ok::before { content: "✓ "; color: #1d1b16; }
.toast.err { background: var(--bad); color: #fff; } .toast.err::before { content: "✗ "; color: #fff; }
.toast ul { margin: 6px 0 0; padding-left: 18px; } .toast code { font-weight: 700; word-break: break-all; }
.toast .bar { height: 12px; border: 2px solid var(--ink); border-radius: 4px; background: var(--paper); margin-top: 8px; overflow: hidden; }
.toast .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--pink) 0 6px, var(--yellow) 6px 12px); transition: width .3s; }
@keyframes pop { from { transform: translateY(-8px) scale(.96); opacity: 0; } }
.burst { position: fixed; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #1d1b16; pointer-events: none; z-index: 60;
  animation: fly .8s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

@media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 52vh 1fr auto; }
  aside { grid-row: 3; padding: 4px 14px 14px; } .stage { grid-row: 2; margin: 14px; } .hide-s { display: none !important; } footer .seg-keys { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="brand"><span class="dots"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span>dotfx</div>
      <div class="file" id="file">no file yet</div>
      <div class="spacer"></div>
      <button class="btn small" id="themeBtn" title="Switch paper / neon (T)"><span class="key">T</span><span id="themeName">neon</span></button>
    </div>
    <div class="toolbar">
      <button class="btn yellow" id="openBtn" title="Open a photo or video"><span class="key">O</span>open</button>
      <button class="btn mint" id="camBtn" title="Use your webcam"><span class="key">W</span>webcam</button>
      <button class="btn purple hide-s" id="matchBtn" title="Recreate the look of a reference image"><span class="key">M</span>match a reference</button>
      <button class="btn orange" id="shuffleBtn" title="Surprise me: a random look with random tweaks"><span class="key">R</span>🎲 shuffle</button>
      <div class="spacer"></div>
      <button class="btn hide-s" id="cmdBtn" title="Copy the equivalent command line"><span class="key">Y</span>copy command</button>
      <button class="btn hide-s" id="saveBtn" title="Download these settings as a preset"><span class="key">S</span>save preset</button>
      <div class="menu" id="exportMenu">
        <button class="btn pink" id="exportBtn"><span class="key">E</span>export ▾</button>
        <div class="menu-list" id="exportList"></div>
      </div>
    </div>
    <div class="prompt" id="prompt" title="Click to copy this command">
      <span class="ps"><span class="tilde">~</span> $</span><code id="promptText"><span class="c-cmd">dotfx</span></code><span class="cursor"></span>
      <span class="hint hide-s">click to copy</span>
    </div>

  </header>

  <aside>
    <div class="panel">

      <div class="pane on" id="pane-looks"><div id="looks"></div></div>
      <div class="pane" id="pane-settings">
        <input class="search" id="search" placeholder="› search settings…  ( / )">
        <div class="seg" id="effectSeg"><button data-v="halftone">● halftone</button><button data-v="dither">▦ dither</button></div>
        <div id="settings"></div>
      </div>

      <button class="btn small" id="compareBtn" title="Before / after (C)"><span class="key">C</span>compare</button>
      <button class="btn small" data-zoom="fit" title="Fit (F)"><span class="key">F</span>fit</button>
      <button class="btn small" data-zoom="1" title="Actual pixels (1)"><span class="key">1</span>1:1</button>
      <button class="btn small" data-zoom="2" title="2× (2)"><span class="key">2</span>2×</button>
    </div>
    <div class="timeline" id="timeline"><b>▶</b><input type="range" id="time" min="0" max="1" step="0.04" value="0"><span id="timeLabel">0.0 / 0.0 s</span></div>
    <div class="webcam-bar"><span class="rec" id="recDot">● REC</span><span id="camFps" style="font-weight:700">—</span>
      <button class="btn small yellow" id="snapBtn"><span class="key">␣</span>snapshot</button><button class="btn small pink" id="recBtn">● record</button>
      <button class="btn small" id="camStop">stop camera</button></div>

      <div class="bigdots" id="bigdots"></div>

      <div class="row"><button class="btn yellow" id="openBtn2"><span class="key">O</span>open a file</button>
        <button class="btn mint" id="camBtn2"><span class="key">W</span>webcam</button>
        <button class="btn pink" id="sampleBtn"><span class="key">★</span>try the sample</button></div>
    </div></div>

    <span class="seg-mode" id="st-mode">EDIT</span><span class="seg-preset" id="st-preset">—</span>
    <span class="seg-render" id="st-render">ready</span><span class="seg-size" id="st-size">—</span>
    <span class="seg-msg" id="st-msg"></span>
    <span class="seg-keys hide-s"><b>←→</b>&nbsp;looks · <b>R</b>&nbsp;shuffle · <b>/</b>&nbsp;search · <b>scroll</b>&nbsp;zoom</span>
  </footer>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Dotfx-Token": TOKEN, ...(opts.headers || {}) } });
async function apiJSON(path, body) {
  const r = await api(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const GROUP_NAMES = { effect: "effect", size: "size", tone: "tone", colors: "colors", halftone: "halftone screen",
  dither: "dither", texture: "print texture", mask: "mask", clipping: "paper clipping" };
const BRIGHTS = ["var(--pink)", "var(--yellow)", "var(--mint)", "var(--orange)", "var(--blue)", "var(--purple)"];
const GROUP_COLORS = { effect: "var(--pink)", size: "var(--yellow)", tone: "var(--mint)", colors: "var(--orange)",
  halftone: "var(--blue)", dither: "var(--blue)", texture: "var(--purple)", mask: "var(--yellow)", clipping: "var(--pink)" };
const HIDE = { halftone: "dither", dither: "halftone" };
const NUMBER_ONLY = new Set(["seed", "width", "height"]);
const PRESET_GROUPS = [["reference looks", n => n.startsWith("newsprint") || n.startsWith("sky-dither")],
  ["black & white, mostly white", n => n.startsWith("bw-")], ["more looks", () => true]];

const S = { schema: null, presets: [], media: null, look: {}, base: {}, preset: null, time: 0,
  zoom: "fit", z: 1, x: 0, y: 0, nat: [0, 0], compare: false, split: 0.5, cam: null };

// ---- theme ---------------------------------------------------------------------------
function setTheme(t) {
  document.documentElement.dataset.theme = t; $("#themeName").textContent = t === "neon" ? "paper" : "neon";
  try { localStorage.setItem("dotfx-theme", t); } catch {}
}
try { setTheme(localStorage.getItem("dotfx-theme") || "paper"); } catch { setTheme("paper"); }
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "neon" ? "paper" : "neon");

// ---- toasts, status, fun -------------------------------------------------------------
function toast(html, kind = "", ms = 4200) {
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = html;
  $("#toasts").append(t); if (ms) setTimeout(() => t.remove(), ms); return t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function status(msg, kind = "") { const el = $("#st-msg"); el.textContent = msg; el.className = "seg-msg " + kind; }
function burst(el) {
  const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("i"); d.className = "burst"; const a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 90;
    d.style.left = cx + "px"; d.style.top = cy + "px"; d.style.background = BRIGHTS[i % BRIGHTS.length];
    d.style.setProperty("--dx", Math.cos(a) * dist + "px"); d.style.setProperty("--dy", Math.sin(a) * dist + "px");
    const s = 0.6 + Math.random() * 1.2; d.style.width = d.style.height = 10 * s + "px";
    document.body.append(d); setTimeout(() => d.remove(), 900);
  }
}
(() => { // the dotted wordmark in the empty state: a little halftone ramp
  const root = $("#bigdots");
  for (let y = 0; y < 3; y++) for (let x = 0; x < 11; x++) {
    const b = document.createElement("b"); const s = Math.max(0.12, 1 - x / 11 - y * 0.12);
    b.style.setProperty("--s", s.toFixed(2)); b.style.setProperty("--c", BRIGHTS[(x + y) % BRIGHTS.length]);
    b.style.setProperty("--d", (x * 0.08 + y * 0.15).toFixed(2) + "s"); root.append(b);
  }
})();
let spinTimer = 0;
function busy(on, text = "rendering") {
  $("#busy").classList.toggle("on", on); $("#busyText").textContent = text;
  clearInterval(spinTimer);
  if (on) { const f = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"; let i = 0; spinTimer = setInterval(() => $("#spin").textContent = f[i++ % f.length], 80); }
}

// ---- settings model -----------------------------------------------------------------
const defaults = () => Object.fromEntries(S.schema.fields.map(f => [f.name, f.default]));
function changed(look = S.look) {
  const d = defaults(); const out = {};
  for (const k in look) if (look[k] !== d[k]) out[k] = look[k];
  return out;
}
function setPresetLabel() { $("#st-preset").textContent = S.preset ? "★ " + S.preset : "custom"; }
function applyPreset(name, extra = null) {
  const p = S.presets.find(p => p.name === name);
  S.preset = name; S.base = { ...defaults(), ...(p ? p.settings : extra || {}) }; S.look = { ...S.base };
  buildSettings(); markLooks(); scheduleRender(); setPresetLabel();
}
function setValue(name, v) { S.look[name] = v; refreshField(name); if (name === "effect") buildSettings(); scheduleRender(); }

// ---- shuffle: a random look, nudged ----------------------------------------------------
const pick = a => a[Math.floor(Math.random() * a.length)];
const INKS = ["#ff4fa3", "#2f6bff", "#12c59a", "#ff7a1a", "#8a5cff", "#1d1b16", "#e8344e", "#0078bf", "#3a3a3c"];
const PAPERS = ["#ffffff", "#fff7e4", "#f6efd9", "#fffbe7", "#eef6ff", "#fff0f6"];
function shuffle() {
  const p = pick(S.presets); applyPreset(p.name);
  const L = S.look; const r = (a, b) => a + Math.random() * (b - a);
  if (L.cells) L.cells = Math.round(L.cells * r(0.6, 1.5));
  else if (L.effect === "halftone") L.cell = +(L.cell * r(0.7, 1.5)).toFixed(1);
  L.contrast = +(L.contrast * r(0.9, 1.25)).toFixed(2);
  if (L.effect === "halftone") L.angle = pick([0, 15, 22.5, 30, 45, 60, 75]);
  if (L.mode === "mono" && Math.random() < 0.6) { L.ink = pick(INKS); L.paper = pick(PAPERS); }
  if (Math.random() < 0.25) L.roughness = +r(0.1, 0.5).toFixed(2);
  if (Math.random() < 0.2) L.grain = +r(0.1, 0.5).toFixed(2);
  S.preset = p.name + " (shuffled)"; buildSettings(); markLooks(); scheduleRender(0); setPresetLabel();
  burst($("#shuffleBtn"));
}
$("#shuffleBtn").onclick = shuffle;

// ---- settings panel --------------------------------------------------------------------
function buildSettings() {
  const root = $("#settings"); root.innerHTML = "";
  const q = $("#search").value.trim().toLowerCase();
  const hidden = HIDE[S.look.effect];
  const groups = {};
  for (const f of S.schema.fields) {
    if (f.group === hidden || f.name === "effect") continue;
    if (q && !(f.name.includes(q.replace(/ /g, "_")) || f.help.toLowerCase().includes(q))) continue;
    (groups[f.group] ||= []).push(f);
  }
  for (const [g, list] of Object.entries(groups)) {
    const det = document.createElement("details"); det.className = "grp"; det.dataset.group = g;
    det.style.setProperty("--c", GROUP_COLORS[g] || "var(--pink)");
    det.open = q !== "" || ["tone", "colors", "halftone", "dither", "size"].includes(g);
    det.innerHTML = `<summary>${GROUP_NAMES[g] || g}<span class="count"></span></summary><div class="grp-body"></div>`;
    for (const f of list) det.querySelector(".grp-body").append(fieldEl(f));
    root.append(det);
  }
  $$("#effectSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.look.effect));
  updateCounts();
}
function fieldEl(f) {
  const row = document.createElement("div"); row.className = "field"; row.dataset.name = f.name;
  row.title = f.help;
  const label = document.createElement("label"); label.textContent = f.name.replace(/_/g, "-");
  label.onclick = e => { if (e.offsetX < 12 && row.classList.contains("changed")) setValue(f.name, S.base[f.name]); };
  const ctl = document.createElement("div"); ctl.className = "ctl";
  if (f.type === "bool") {
    const sw = document.createElement("button"); sw.className = "switch"; sw.onclick = () => setValue(f.name, !S.look[f.name]);
    ctl.append(sw);
  } else if (f.choices.length) {
    const sel = document.createElement("select");
    sel.innerHTML = f.choices.map(c => `<option>${esc(c)}</option>`).join("");
    sel.onchange = () => setValue(f.name, sel.value); ctl.append(sel);
  } else if (f.color) {
    const pickEl = document.createElement("input"); pickEl.type = "color";
    const txt = document.createElement("input"); txt.className = "text"; txt.style.flex = "1";
    pickEl.oninput = () => setValue(f.name, pickEl.value);
    txt.onchange = () => setValue(f.name, txt.value.trim());
    ctl.append(pickEl, txt);
    if (f.none_ok) {
      const none = document.createElement("label"); none.className = "none-tag";
      none.innerHTML = `<input type="checkbox"> none`;
      none.querySelector("input").onchange = e => setValue(f.name, e.target.checked ? "none" : (f.default === "none" ? "#ffffff" : f.default));
      ctl.append(none);
    }
  } else if ((f.type === "int" || f.type === "float") && NUMBER_ONLY.has(f.name)) {
    const num = document.createElement("input"); num.className = "num"; num.type = "number"; num.step = f.step;
    num.style.width = "100%"; num.onchange = () => { if (num.value !== "") setValue(f.name, Math.round(+num.value)); };
    ctl.append(num);
  } else if (f.type === "int" || f.type === "float") {
    const range = document.createElement("input"); range.type = "range";
    range.min = f.min; range.max = f.max; range.step = f.step;
    const num = document.createElement("input"); num.className = "num"; num.type = "number"; num.step = f.step;
    const cast = x => f.type === "int" ? Math.round(+x) : +x;
    range.oninput = () => setValue(f.name, cast(range.value));
    num.onchange = () => { if (num.value !== "") setValue(f.name, cast(num.value)); };
    ctl.append(range, num);
  } else {
    const txt = document.createElement("input"); txt.className = "text";
    const list = f.name === "palette" ? Object.keys(S.schema.palettes) : f.name === "background"
      ? ["original", "paper", "none", ...S.presets.map(p => p.name)] : f.name === "mask" ? ["bright", "dark", "colorful", "center"] : null;
    if (list) { const id = "dl-" + f.name; txt.setAttribute("list", id);
      ctl.insertAdjacentHTML("beforeend", `<datalist id="${id}">${list.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`); }
    txt.onchange = () => setValue(f.name, txt.value);
    ctl.prepend(txt);
  }
  row.append(label, ctl); setTimeout(() => refreshField(f.name, row));
  return row;
}
function hexOf(v) {
  if (!v || v === "none") return "#ffffff";
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v)) return "#" + [...v.slice(1)].map(c => c + c).join("");
  return S.schema.named_colors[v.toLowerCase()] || "#808080";
}
function refreshField(name, row = $(`.field[data-name="${name}"]`)) {
  if (!row) return;
  const f = S.schema.fields.find(f => f.name === name); const v = S.look[name];
  row.classList.toggle("changed", v !== S.base[name]);
  if (f.type === "bool") row.querySelector(".switch").classList.toggle("on", !!v);
  else if (f.choices.length) row.querySelector("select").value = v;
  else if (f.color) { row.querySelector("input[type=color]").value = hexOf(v); row.querySelector(".text").value = v;
    const n = row.querySelector(".none-tag input"); if (n) n.checked = v === "none"; }
  else if (f.type === "int" || f.type === "float") { const rg = row.querySelector("input[type=range]"); if (rg) rg.value = v;
    const num = row.querySelector(".num"); if (document.activeElement !== num) num.value = +(+v).toFixed(4); }
  else row.querySelector(".text").value = v;
  updateCounts();
}
function updateCounts() {
  for (const det of $$("details.grp")) {
    const n = $$(".field.changed", det).length;
    det.querySelector(".count").textContent = n ? `${n}*` : "";
  }
}

// ---- looks gallery -----------------------------------------------------------------------
function buildLooks(thumbs = {}) {
  const root = $("#looks"); root.innerHTML = ""; const seen = new Set(); let gi = 0, li = 0;
  for (const [title, member] of PRESET_GROUPS) {
    const names = S.presets.map(p => p.name).filter(n => !seen.has(n) && member(n)); if (!names.length) continue;
    names.forEach(n => seen.add(n));
    root.insertAdjacentHTML("beforeend", `<div class="group-title" style="--c:${BRIGHTS[gi++ % BRIGHTS.length]}"><span>${title}</span></div>`);
    const grid = document.createElement("div"); grid.className = "looks";
    for (const n of names) {
      const p = S.presets.find(p => p.name === n);
      const b = document.createElement("button"); b.className = "look"; b.dataset.preset = n; b.title = p.description;
      b.style.setProperty("--c", BRIGHTS[li++ % BRIGHTS.length]);
      b.innerHTML = (thumbs[n] ? `<img src="${thumbs[n]}" alt="">` : `<div class="ph"></div>`) + `<span>${esc(n)}</span>`;
      b.onclick = () => applyPreset(n); grid.append(b);
    }
    root.append(grid);
  }
  markLooks();
}
function markLooks() { $$(".look").forEach(b => b.classList.toggle("on", b.dataset.preset === S.preset)); }
async function loadThumbs() {
  if (!S.media) return;
  const id = S.media.id;
  try { const list = await apiJSON("/api/thumbs", { media: id, time: 0 });
    if (S.media && S.media.id === id) buildLooks(Object.fromEntries(list.map(t => [t.preset, t.src]))); }
  catch (e) { status(e.message, "err"); }
}

// ---- the live command line in the header ------------------------------------------------
let promptTimer = 0, lastCommand = "dotfx";
function colorCommand(cmd) {
  const parts = cmd.match(/'[^']*'|\S+/g) || [];
  return parts.map((p, i) => {
    if (i === 0) return `<span class="c-cmd">${esc(p)}</span>`;
    if (i === 1) return `<span class="c-file">${esc(p)}</span>`;
    if (p.startsWith("-")) return `<span class="c-flag">${esc(p)}</span>`;
    return `<span class="c-val">${esc(p)}</span>`;
  }).join(" ");
}
function updatePrompt() {
  clearTimeout(promptTimer);
  promptTimer = setTimeout(async () => {
    try {
      const j = await apiJSON("/api/command", { media: S.media && S.media.id, settings: changed() });
      lastCommand = j.command; $("#promptText").innerHTML = colorCommand(j.command);
    } catch {}
  }, 150);
}
$("#prompt").onclick = async () => {
  try { await navigator.clipboard.writeText(lastCommand); toast("command copied — paste it in your terminal", "ok"); burst($("#prompt")); }
  catch { toast("<code>" + esc(lastCommand) + "</code>", "", 12000); }
};

// ---- rendering --------------------------------------------------------------------------
let renderTimer = 0, inflight = false, pending = false, seq = 0, lastURL = "", beforeURL = "", beforeKey = "";
function scheduleRender(delay = 110) { updatePrompt(); if (S.cam) return; clearTimeout(renderTimer); renderTimer = setTimeout(doRender, delay); }
async function doRender() {
  if (!S.media) return;
  if (inflight) { pending = true; return; }
  inflight = true; pending = false; const my = ++seq; busy(true);
  try {
    const r = await api("/api/render", { method: "POST", body: JSON.stringify({ media: S.media.id, settings: changed(), time: S.time }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob(); if (my !== seq) return;
    const url = URL.createObjectURL(blob); const img = $("#after");
    await new Promise(res => { img.onload = res; img.src = url; });
    if (lastURL) URL.revokeObjectURL(lastURL); lastURL = url;
    const [w, h] = r.headers.get("X-Size").split("x").map(Number); const k = +r.headers.get("X-Scale");
    const first = S.nat[0] !== w || S.nat[1] !== h; S.nat = [w, h]; if (first) layout();
    $("#st-render").textContent = `✓ ${r.headers.get("X-Render-Ms")} ms`;
    $("#st-size").textContent = `${w}×${h}` + (k < 1 ? ` · preview ${Math.round(k * 100)}%` : "");
    status(k < 1 ? "big image: previewing smaller, export is full size" : ""); loadBefore();
  } catch (e) { status("✗ " + e.message, "err"); }
  finally { inflight = false; busy(false); if (pending) doRender(); }
}
async function loadBefore() {
  const s = changed(); const key = [S.media.id, S.time, s.width, s.height, s.scale].join("|");
  if (key === beforeKey) return; beforeKey = key;
  const sizing = Object.fromEntries(Object.entries(s).filter(([k]) => ["width", "height", "scale"].includes(k)));
  const r = await api(`/api/original?media=${S.media.id}&time=${S.time}&s=${encodeURIComponent(JSON.stringify(sizing))}`);
  if (!r.ok) return; const url = URL.createObjectURL(await r.blob());
  $("#before").src = url; if (beforeURL) URL.revokeObjectURL(beforeURL); beforeURL = url;
}

// ---- viewport ---------------------------------------------------------------------------
function layout() {
  const vp = $("#viewport").getBoundingClientRect(); const [w, h] = S.nat; if (!w) return;
  if (S.zoom === "fit") { S.z = Math.min((vp.width - 64) / w, (vp.height - 64) / h, 4); S.x = (vp.width - w * S.z) / 2 - 4; S.y = (vp.height - h * S.z) / 2 - 4; }
  apply();
}
function apply() {
  const c = $("#canvas"); const [w, h] = S.nat;
  c.style.width = w + "px"; c.style.height = h + "px";
  c.style.transform = `translate(${S.x}px, ${S.y}px) scale(${S.z})`;
  c.style.outlineWidth = 3 / S.z + "px"; c.style.boxShadow = `${10 / S.z}px ${10 / S.z}px 0 var(--pink)`;
  c.classList.toggle("pixel", S.z >= 1.5);
  const sx = S.x + w * S.z * S.split; $("#split").style.left = sx + "px";
  $("#before").style.clipPath = `inset(0 ${(1 - S.split) * 100}% 0 0)`;
  $$("[data-zoom]").forEach(b => b.classList.toggle("on", String(S.zoom) === b.dataset.zoom));
}
function zoomTo(z, cx, cy) {
  const vp = $("#viewport").getBoundingClientRect();
  cx ??= vp.width / 2; cy ??= vp.height / 2;
  const k = z / S.z; S.x = cx - (cx - S.x) * k; S.y = cy - (cy - S.y) * k; S.z = z; S.zoom = z; apply();
}
function setZoom(v) {
  if (v === "fit") { S.zoom = "fit"; layout(); return; }
  zoomTo(+v); S.zoom = v;
  const vp = $("#viewport").getBoundingClientRect(); const [w, h] = S.nat;
  if (w * S.z < vp.width) S.x = (vp.width - w * S.z) / 2; if (h * S.z < vp.height) S.y = (vp.height - h * S.z) / 2; apply();
}
(() => {
  const vp = $("#viewport"); let drag = null;
  vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect();
    const z = Math.min(Math.max(S.z * Math.exp(-e.deltaY * 0.0015), 0.05), 16); zoomTo(z, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  vp.addEventListener("pointerdown", e => {
    const r = vp.getBoundingClientRect();
    const onSplit = S.compare && e.target.closest(".split");
    drag = { x: e.clientX, y: e.clientY, ox: S.x, oy: S.y, split: !!onSplit, r };
    vp.setPointerCapture(e.pointerId); vp.classList.add("drag"); });
  vp.addEventListener("pointermove", e => { if (!drag) return;
    if (drag.split) { S.split = Math.min(Math.max((e.clientX - drag.r.left - S.x) / (S.nat[0] * S.z), 0), 1); apply(); return; }
    S.x = drag.ox + e.clientX - drag.x; S.y = drag.oy + e.clientY - drag.y; if (S.zoom === "fit") S.zoom = S.z; apply(); });
  vp.addEventListener("pointerup", () => { drag = null; vp.classList.remove("drag"); });
  vp.addEventListener("dblclick", () => setZoom(S.zoom === "fit" ? "1" : "fit"));
  addEventListener("resize", () => { if (S.zoom === "fit") layout(); else apply(); });
})();
function toggleCompare() { S.compare = !S.compare; $("#viewport").classList.toggle("compare", S.compare);
  $("#compareBtn").classList.toggle("on", S.compare); $("#compareBtn2").classList.toggle("on", S.compare); apply(); }

// ---- media -----------------------------------------------------------------------------
function setMedia(m) {
  S.media = m; S.time = 0; S.nat = [0, 0]; S.zoom = "fit"; beforeKey = "";
  $("#empty").style.display = m ? "none" : "";
  $("#file").innerHTML = m ? `› <b>${esc(m.name)}</b> ${m.width}×${m.height}${m.kind === "video" ? ` · ${m.duration.toFixed(1)}s video` : ""}` : "no file yet";
  $("#st-mode").textContent = m && m.kind === "video" ? "VIDEO" : "EDIT";
  const tl = $("#timeline"); tl.classList.toggle("on", !!m && m.kind === "video");
  if (m && m.kind === "video") { const t = $("#time"); t.max = Math.max(m.duration - 1 / m.fps, 0); t.step = 1 / m.fps; t.value = 0; timeLabel(); }
  buildExportMenu(); buildLooks(); updatePrompt(); if (m) { scheduleRender(0); loadThumbs(); }
}
function timeLabel() { $("#timeLabel").textContent = `${S.time.toFixed(2)} / ${S.media.duration.toFixed(1)}s`; }
$("#time").oninput = e => { S.time = +e.target.value; timeLabel(); scheduleRender(60); };
async function openFile(file) {
  if (!file) return; stopCam();
  const t = toast(`opening <b>${esc(file.name)}</b>…`, "", 0);
  try { const r = await api(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const j = await r.json(); if (!r.ok) throw new Error(j.error); setMedia(j); t.remove(); }
  catch (e) { t.remove(); toast(esc(e.message), "err"); }
}
$("#fileInput").onchange = e => openFile(e.target.files[0]);
for (const id of ["#openBtn", "#openBtn2"]) $(id).onclick = () => $("#fileInput").click();
$("#sampleBtn").onclick = async () => setMedia(await apiJSON("/api/sample"));
(() => { let n = 0; const st = $("#app");
  addEventListener("dragenter", e => { e.preventDefault(); n++; st.classList.add("dropping"); });
  addEventListener("dragleave", () => { if (--n <= 0) { n = 0; st.classList.remove("dropping"); } });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => { e.preventDefault(); n = 0; st.classList.remove("dropping"); openFile(e.dataTransfer.files[0]); }); })();

// ---- export / preset / command / match -------------------------------------------------------
function buildExportMenu() {
  const v = S.media && S.media.kind === "video";
  const items = [["png", "png image", "lossless"], ["jpg", "jpeg image", "small"], ["svg", "svg vector", "real dots"], ["pdf", "pdf vector", "for print"]];
  if (v) items.push(null, ["mp4", "mp4 video", "with audio"], ["webm", "webm video", ""], ["gif", "gif", "loops"]);
  $("#exportList").innerHTML = items.map(i => i ? `<button data-fmt="${i[0]}">${i[1]} <small>${i[2]}</small></button>` : "<hr>").join("");
  $$("#exportList button").forEach(b => b.onclick = () => { $("#exportMenu").classList.remove("open"); exportAs(b.dataset.fmt); });
}
$("#exportBtn").onclick = e => { e.stopPropagation(); $("#exportMenu").classList.toggle("open"); };
addEventListener("click", () => $("#exportMenu").classList.remove("open"));
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function exportAs(fmt) {
  if (!S.media) return toast("open something first", "err");
  const body = JSON.stringify({ media: S.media.id, settings: changed(), format: fmt, time: S.time });
  if (["mp4", "webm", "gif"].includes(fmt)) {
    const t = toast(`rendering <b>${fmt}</b>… <span class="pct">0%</span><div class="bar"><i></i></div>`, "", 0);
    try { const r = await api("/api/export", { method: "POST", body }); const job = await r.json(); if (!r.ok) throw new Error(job.error);
      while (true) { await new Promise(res => setTimeout(res, 500)); const j = await apiJSON(`/api/job/${job.id}`);
        const pct = j.total ? Math.min(100, Math.round(j.done / j.total * 100)) : 0;
        $(".bar i", t).style.width = pct + "%"; $(".pct", t).textContent = `${pct}% · ${j.done}${j.total ? "/" + j.total : ""} frames`;
        if (j.state === "error") throw new Error(j.error);
        if (j.state === "done") { const f = await api(`/api/job/${job.id}/file`); download(await f.blob(), j.name); break; } }
      t.remove(); toast(`exported <b>${fmt}</b> video`, "ok"); burst($("#exportBtn")); }
    catch (e) { t.remove(); toast(esc(e.message), "err", 8000); }
    return;
  }
  const t = toast(`exporting <b>${fmt}</b> at full size…`, "", 0);
  try { const r = await api("/api/export", { method: "POST", body }); if (!r.ok) throw new Error((await r.json()).error);
    const name = (r.headers.get("Content-Disposition").match(/filename="(.+)"/) || [])[1] || "dotfx." + fmt;
    download(await r.blob(), name); t.remove(); toast(`saved <b>${esc(name)}</b>`, "ok"); burst($("#exportBtn")); }
  catch (e) { t.remove(); toast(esc(e.message), "err"); }
}
$("#saveBtn").onclick = async () => { const r = await api("/api/preset", { method: "POST", body: JSON.stringify({ settings: changed() }) });
  download(await r.blob(), (S.preset || "dotfx-look").replace(/[^\w.-]+/g, "-") + ".toml");
  toast("preset saved — use it with <code>dotfx photo.jpg -p FILE.toml</code>", "ok"); burst($("#saveBtn")); };
$("#cmdBtn").onclick = () => $("#prompt").click();
$("#matchBtn").onclick = () => $("#refInput").click();
$("#refInput").onchange = async e => {
  const file = e.target.files[0]; if (!file) return; e.target.value = "";
  const t = toast(`measuring <b>${esc(file.name)}</b>… <div class="bar"><i style="width:65%"></i></div>`, "", 0);
  try { const r = await api(`/api/match?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    S.preset = "matched: " + file.name; S.base = { ...defaults(), ...j.settings }; S.look = { ...S.base };
    buildSettings(); markLooks(); scheduleRender(0); setPresetLabel();
    t.remove(); toast(`matched <b>${esc(file.name)}</b><ul>${j.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`, "ok", 12000); burst($("#matchBtn")); }
  catch (e) { t.remove(); toast(esc(e.message), "err", 8000); }
};
$("#resetBtn").onclick = () => { S.look = { ...S.base }; buildSettings(); scheduleRender(0); };
$("#compareBtn").onclick = toggleCompare; $("#compareBtn2").onclick = toggleCompare;
$$("[data-zoom]").forEach(b => b.onclick = () => setZoom(b.dataset.zoom));
$$(".tab").forEach(b => b.onclick = () => { $$(".tab").forEach(x => x.classList.toggle("on", x === b));
  $$(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.pane)); });
$("#search").oninput = buildSettings;
$$("#effectSeg button").forEach(b => b.onclick = () => setValue("effect", b.dataset.v));

// ---- webcam ------------------------------------------------------------------------------
async function startCam() {
  if (S.cam) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 } }, audio: false }); }
  catch (e) { return toast("camera unavailable: " + esc(e.message), "err", 7000); }
  const v = $("#video"); v.srcObject = stream; await v.play();
  S.cam = { stream, run: true, frames: [], recorder: null, chunks: [] };
  $("#stage").classList.add("webcam"); $("#empty").style.display = "none";
  $("#camBtn").classList.add("on"); $("#timeline").classList.remove("on"); $("#st-mode").textContent = "LIVE ●";
  $("#file").innerHTML = `› <b>webcam</b> ${v.videoWidth}×${v.videoHeight}`;
  const still = await grab(480, "image/jpeg");  // a still for the look thumbnails
  api(`/api/upload?name=webcam.jpg`, { method: "POST", body: still }).then(r => r.json()).then(m => { S.media = m; loadThumbs(); buildExportMenu(); });
  camLoop();
}
async function grab(width, type = "image/jpeg") {
  const v = $("#video"), c = $("#grab"); const w = Math.min(width, v.videoWidth); const h = Math.round(v.videoHeight * w / v.videoWidth);
  c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, w, h);
  return new Promise(res => c.toBlob(res, type, 0.9));
}
let recCanvas = null;
async function camLoop() {
  const img = $("#after"); let last = performance.now();
  while (S.cam && S.cam.run) {
    try {
      const blob = await grab(560);
      const r = await api("/api/frame", { method: "POST", body: blob, headers: { "X-Settings": JSON.stringify(changed()) } });
      if (!r.ok) throw new Error((await r.json()).error);
      const url = URL.createObjectURL(await r.blob());
      await new Promise(res => { img.onload = res; img.src = url; });
      if (lastURL) URL.revokeObjectURL(lastURL); lastURL = url;
      if (S.nat[0] !== img.naturalWidth) { S.nat = [img.naturalWidth, img.naturalHeight]; S.zoom = "fit"; layout(); }
      if (S.cam && S.cam.recorder) { recCanvas.getContext("2d").drawImage(img, 0, 0, recCanvas.width, recCanvas.height); }
      const now = performance.now(); S.cam && S.cam.frames.push(now - last); last = now;
      if (S.cam && S.cam.frames.length > 10) S.cam.frames.shift();
      const avg = S.cam ? S.cam.frames.reduce((a, b) => a + b, 0) / S.cam.frames.length : 0;
      $("#camFps").textContent = `${(1000 / avg).toFixed(1)} fps`;
      $("#st-render").textContent = `● ${r.headers.get("X-Render-Ms")} ms/frame`; $("#st-size").textContent = `${img.naturalWidth}×${img.naturalHeight}`;
    } catch (e) { status("✗ " + e.message, "err"); await new Promise(res => setTimeout(res, 500)); }
  }
}
function stopCam() {
  if (!S.cam) return; S.cam.run = false; if (S.cam.recorder) S.cam.recorder.stop();
  S.cam.stream.getTracks().forEach(t => t.stop()); S.cam = null;
  $("#stage").classList.remove("webcam", "recording"); $("#camBtn").classList.remove("on");
  if (!S.media) $("#empty").style.display = ""; else setMedia(S.media);
}
for (const id of ["#camBtn", "#camBtn2"]) $(id).onclick = () => S.cam ? stopCam() : startCam();
$("#camStop").onclick = stopCam;
async function snapshot() {
  if (!S.cam) return;
  const blob = await grab(4096);
  const r = await api("/api/frame?png=1", { method: "POST", body: blob, headers: { "X-Settings": JSON.stringify(changed()) } });
  download(await r.blob(), `dotfx-snapshot-${Date.now()}.png`); toast("snapshot saved at full camera resolution", "ok");
  burst($("#snapBtn")); const s = $("#stage"); s.style.outline = "6px solid var(--yellow)"; setTimeout(() => s.style.outline = "", 200);
}
$("#snapBtn").onclick = snapshot;
$("#recBtn").onclick = () => {
  const cam = S.cam; if (!cam) return;
  if (cam.recorder) { cam.recorder.stop(); return; }
  const img = $("#after"); recCanvas = document.createElement("canvas");
  recCanvas.width = img.naturalWidth - img.naturalWidth % 2; recCanvas.height = img.naturalHeight - img.naturalHeight % 2;
  const rec = new MediaRecorder(recCanvas.captureStream(20), { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
  cam.chunks = []; rec.ondataavailable = e => cam.chunks.push(e.data);
  rec.onstop = () => { download(new Blob(cam.chunks, { type: "video/webm" }), `dotfx-live-${Date.now()}.webm`);
    cam.recorder = null; $("#stage").classList.remove("recording"); $("#recBtn").textContent = "● record"; toast("recording saved", "ok"); };
  rec.start(500); cam.recorder = rec; $("#stage").classList.add("recording"); $("#recBtn").textContent = "■ stop";
};

// ---- keyboard ------------------------------------------------------------------------------
addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "f") setZoom("fit"); else if (k === "1") setZoom("1"); else if (k === "2") setZoom("2");
  else if (k === "c") toggleCompare(); else if (k === "o") $("#fileInput").click();
  else if (k === "w") (S.cam ? stopCam() : startCam());
  else if (k === "m") $("#refInput").click();
  else if (k === "r") shuffle();
  else if (k === "t") $("#themeBtn").click();
  else if (k === "s") $("#saveBtn").click();
  else if (k === "y") $("#prompt").click();
  else if (k === " " && S.cam) { e.preventDefault(); snapshot(); }
  else if (k === "e") { e.stopPropagation(); $("#exportMenu").classList.toggle("open"); }
  else if (k === "/") { e.preventDefault(); $$(".tab")[1].click(); $("#search").focus(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const names = S.presets.map(p => p.name);
    const i = names.indexOf((S.preset || "").replace(" (shuffled)", "")); applyPreset(names[(i + (e.key === "ArrowRight" ? 1 : -1) + names.length) % names.length]); }
});

// ---- start ---------------------------------------------------------------------------------
(async () => {
  try {
    [S.schema, S.presets] = await Promise.all([apiJSON("/api/schema"), apiJSON("/api/presets")]);
  } catch (e) { document.body.innerHTML = `<pre style="padding:40px">dotfx: can't reach the engine (${esc(e.message)}).\nopen the link printed in your terminal.</pre>`; return; }
  const init = await apiJSON("/api/state");
  S.preset = init.preset; S.base = { ...defaults(), ...(S.presets.find(p => p.name === init.preset) || { settings: {} }).settings };
  S.look = { ...defaults(), ...init.settings };
  if (!init.preset && Object.keys(init.settings).length) S.base = { ...S.look };
  if (!init.preset && !Object.keys(init.settings).length) { const p = S.presets.find(p => p.name === "newsprint"); S.preset = "newsprint"; S.base = { ...defaults(), ...p.settings }; S.look = { ...S.base }; }
  setPresetLabel();
  buildSettings(); buildLooks(); buildExportMenu(); setMedia(init.media);
  if (init.mode === "webcam" || location.hash === "#webcam") startCam();
})();
</script>
</body>
