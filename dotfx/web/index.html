<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotfx</title>
<style>
/* Quiet neutrals, one accent. The image is the interface. */
:root {
  color-scheme: light dark;
  --bg: #f3f2ef; --stage: #e9e8e4; --panel: #fbfbf9; --ink: #161616; --muted: #8b8a85; --faint: #c9c7c1; --line: #dddbd5;
  --accent: #ff4f00; --on-accent: #fff; --bad: #d92d20;
  --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --stage: #0b0b0b; --panel: #181818; --ink: #ececea; --muted: #7d7c78; --faint: #3c3b39; --line: #262625;
    --accent: #ff6a26; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.5 var(--mono); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--accent); color: var(--on-accent); }

.app { display: grid; grid-template-rows: 44px 1fr auto; height: 100vh; }

/* ── top line ───────────────────────────────────────────────────────── */
header { display: flex; align-items: center; gap: 22px; padding: 0 20px; }
.brand { font-weight: 700; letter-spacing: .5px; }
.brand::after { content: "."; color: var(--accent); }
.file { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
nav { display: flex; align-items: center; gap: 18px; white-space: nowrap; }
.link { color: var(--muted); }
.link:hover, .link.on { color: var(--ink); }
.link.on { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; }
.link.accent { color: var(--accent); font-weight: 700; }
.link.accent:hover { color: var(--ink); }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 28px; min-width: 210px; z-index: 30; padding: 6px 0; display: none;
  background: var(--panel); border: 1px solid var(--line); }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; width: 100%; gap: 12px; padding: 5px 14px; text-align: left; }
.menu-list button:hover { color: var(--accent); }
.menu-list small { color: var(--muted); margin-left: auto; }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }

/* ── stage ──────────────────────────────────────────────────────────── */
.stage { position: relative; overflow: hidden; background: var(--stage); }
.viewport { position: absolute; inset: 0; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas img { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.canvas.pixel img { image-rendering: pixelated; }
.canvas .checker { position: absolute; inset: 0; background: repeating-conic-gradient(#d6d6d6 0 25%, #f2f2f2 0 50%) 0 0 / 16px 16px; }
#before { display: none; }
.compare #before { display: block; }
.split { position: absolute; top: 0; bottom: 0; width: 0; display: none; z-index: 5; }
.compare .split { display: block; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--accent); }
.split i { position: absolute; top: 50%; left: -14px; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: var(--accent);
  color: var(--on-accent); display: grid; place-items: center; font-style: normal; cursor: ew-resize; }
.tag { position: absolute; top: 14px; color: var(--muted); z-index: 6; display: none; }
.compare .tag { display: block; }
.tools { position: absolute; right: 18px; top: 12px; display: flex; gap: 14px; z-index: 10; opacity: 0; transition: opacity .2s; }
.stage:hover .tools, .tools:focus-within { opacity: 1; }
.busy { position: absolute; left: 20px; top: 12px; z-index: 10; color: var(--muted); display: none; }
.busy.on { display: block; }
.timeline { display: none; align-items: center; gap: 14px; color: var(--muted); }
.timeline input { flex: 1; }
.timeline.on { display: flex; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 4; }
.empty h1 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.empty p { margin: 0 0 18px; color: var(--muted); }
.empty .row { display: flex; gap: 22px; justify-content: center; }
.dropping .stage::after { content: "drop to open"; position: absolute; inset: 0; display: grid; place-items: center; z-index: 40;
  background: color-mix(in srgb, var(--stage) 85%, transparent); color: var(--accent); font-weight: 700; outline: 2px solid var(--accent); outline-offset: -12px; }
.webcam-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10; display: none; gap: 20px; align-items: center;
  padding: 6px 16px; background: var(--panel); white-space: nowrap; }
.webcam .webcam-bar { display: flex; }
.rec { display: none; color: var(--bad); font-weight: 700; }
.recording .rec { display: inline; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── bottom: looks + a few settings ─────────────────────────────────── */
footer { padding: 10px 20px 12px; display: grid; gap: 8px; min-width: 0; }
.looks { display: flex; gap: 16px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; scrollbar-width: none; }
.looks::-webkit-scrollbar { display: none; }
.looks { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 60px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 60px), transparent); padding-right: 60px; }
.looks .sep { color: var(--faint); }
.look { color: var(--muted); outline: none; }
.look:focus-visible { text-decoration: underline; }
.look:hover { color: var(--ink); }
.look.on { color: var(--accent); font-weight: 700; }
.bar-row { display: flex; align-items: center; gap: 26px; min-height: 26px; min-width: 0; }
.quick { display: flex; align-items: center; gap: 22px; min-width: 0; overflow: hidden; }
.quick .field { display: flex; align-items: center; gap: 10px; padding: 0; }
.quick input[type=range] { width: 90px; flex: none; }
.quick .num { width: 46px; }
.quick .text { width: 78px; }
.quick .none-tag { display: none; }
.seg { display: flex; gap: 12px; }
.seg button { color: var(--muted); }
.seg button.on { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; }
.status { flex: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .err { color: var(--bad); }
.thumbtip { position: fixed; z-index: 60; width: 150px; height: 150px; pointer-events: none; display: none; object-fit: cover; background: var(--stage); }

/* ── settings drawer ────────────────────────────────────────────────── */
.drawer { position: fixed; top: 44px; right: 0; bottom: 0; width: 360px; z-index: 20; background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px 8px; }
.drawer-head b { font-weight: 700; }
.search { flex: 1; min-width: 0; height: 26px; border: 0; border-bottom: 1px solid var(--line); background: none; outline: none; }
.search:focus { border-bottom-color: var(--accent); }
.drawer-body { flex: 1; overflow: auto; padding: 0 18px 12px; }
.drawer-foot { display: flex; gap: 18px; padding: 10px 18px; border-top: 1px solid var(--line); }
details.grp { margin-top: 12px; }
details.grp summary { list-style: none; cursor: pointer; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; padding: 4px 0; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::before { content: "+ "; } details.grp[open] summary::before { content: "− "; }
details.grp summary:hover { color: var(--ink); }
details.grp summary .count { color: var(--accent); margin-left: 6px; }
.field { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; padding: 3px 0; }
.field label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field.changed label { color: var(--ink); }
.field.changed label::after { content: " •"; color: var(--accent); cursor: pointer; }
.field .ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.num, .text, .field select { height: 24px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--line); background: none; outline: none; border-radius: 0; }
.num { width: 54px; text-align: right; -moz-appearance: textfield; } .text, .field select { width: 100%; }
.num::-webkit-inner-spin-button { display: none; }
.num:focus, .text:focus, .field select:focus { border-bottom-color: var(--accent); }
.field select option { background: var(--panel); }
input[type=color] { width: 20px; height: 20px; padding: 0; border: 1px solid var(--line); background: none; flex: none; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } input[type=color]::-webkit-color-swatch { border: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 16px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--faint); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--ink); }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { background: var(--accent); }
input[type=range]::-moz-range-track { height: 1px; background: var(--faint); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }
.switch { color: var(--muted); } .switch::before { content: "off"; }
.switch.on { color: var(--accent); } .switch.on::before { content: "on"; }
.none-tag { color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; }

/* ── toasts ─────────────────────────────────────────────────────────── */
.toasts { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 50; }
.toast { max-width: 520px; padding: 7px 14px; background: var(--ink); color: var(--bg); animation: pop .15s ease-out; }
.toast.err { background: var(--bad); color: #fff; }
.toast.ok::before { content: "✓ "; color: var(--accent); }
.toast ul { margin: 4px 0 0; padding-left: 18px; } .toast code { word-break: break-all; }
.toast .bar { height: 2px; background: color-mix(in srgb, var(--bg) 25%, transparent); margin-top: 6px; }
.toast .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

@media (max-width: 820px) { .hide-s { display: none !important; } header { gap: 14px; padding: 0 14px; } nav { gap: 12px; }
  footer { padding: 8px 14px 10px; } .bar-row, .quick { flex-wrap: wrap; gap: 8px 18px; } .drawer { width: 100%; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="brand">dotfx</span>
    <span class="file" id="file"></span>
    <span class="spacer"></span>
    <nav>
      <button class="link" id="openBtn" title="Open a photo or video (O)">open</button>
      <button class="link" id="camBtn" title="Webcam (W)">webcam</button>
      <button class="link hide-s" id="matchBtn" title="Copy the look of a reference image (M)">match</button>
      <button class="link hide-s" id="shuffleBtn" title="A random look (R)">shuffle</button>
      <button class="link" id="settingsBtn" title="All settings (S)">settings</button>
      <button class="link hide-s" id="cmdBtn" title="Copy the equivalent command line">copy command</button>
      <button class="link hide-s" id="saveBtn" title="Download these settings as a preset">save preset</button>
      <div class="menu" id="exportMenu">
        <button class="link accent" id="exportBtn" title="Export (E)">export ↓</button>
        <div class="menu-list" id="exportList"></div>
      </div>
    </nav>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <input type="file" id="refInput" accept="image/*" hidden>
  </header>

  <section class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas"><div class="checker"></div><img id="after" alt=""><img id="before" alt=""></div>
      <div class="split" id="split"><i>↔</i></div>
      <div class="tag" id="tagB" style="left:20px">before</div><div class="tag" id="tagA" style="right:20px">after</div>
    </div>
    <div class="busy" id="busy"><span id="spin">·</span> <span id="busyText">rendering</span></div>
    <div class="tools">
      <button class="link" id="compareBtn" title="Before / after (C)">compare</button>
      <button class="link" data-zoom="fit" title="Fit (F)">fit</button>
      <button class="link" data-zoom="1" title="Actual pixels (1)">1:1</button>
      <button class="link" data-zoom="2" title="2× (2)">2×</button>
    </div>
    <div class="webcam-bar"><span class="rec" id="recDot">● rec</span><span id="camFps">—</span>
      <button class="link" id="snapBtn">snapshot</button><button class="link accent" id="recBtn">record</button>
      <button class="link" id="camStop">stop</button></div>
    <div class="empty" id="empty"><div>
      <h1>Drop a photo or video</h1><p>or</p>
      <div class="row"><button class="link accent" id="openBtn2">open a file</button>
        <button class="link" id="camBtn2">use webcam</button>
        <button class="link" id="sampleBtn">try the sample</button></div>
    </div></div>
    <video id="video" playsinline muted hidden></video>
    <canvas id="grab" hidden></canvas>
  </section>

  <footer>
    <div class="timeline" id="timeline"><input type="range" id="time" min="0" max="1" step="0.04" value="0"><span id="timeLabel">0.0 / 0.0s</span></div>
    <div class="looks" id="looks"></div>
    <div class="bar-row">
      <div class="seg" id="effectSeg"><button data-v="halftone">halftone</button><button data-v="dither">dither</button></div>
      <div class="quick" id="quick"></div>
      <span class="spacer"></span>
      <span class="status" id="status"><span id="st-msg"></span> <span id="st-render"></span> <span id="st-size"></span></span>
    </div>
  </footer>
</div>

<aside class="drawer" id="drawer">
  <div class="drawer-head"><b>settings</b><input class="search" id="search" placeholder="search  /"><button class="link" id="drawerClose" title="Close (Esc)">close</button></div>
  <div class="drawer-body" id="settings"></div>
  <div class="drawer-foot"><button class="link" id="resetBtn" title="Back to the look's values">reset</button>
    <button class="link" id="compareBtn2" title="Before / after (C)">compare</button></div>
</aside>
<img class="thumbtip" id="thumbtip" alt="">
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Dotfx-Token": TOKEN, ...(opts.headers || {}) } });
async function apiJSON(path, body) {
  const r = await api(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const GROUP_NAMES = { effect: "effect", size: "size", tone: "tone", colors: "colors", halftone: "halftone screen",
  dither: "dither", texture: "print texture", mask: "mask", clipping: "paper clipping" };
const HIDE = { halftone: "dither", dither: "halftone" };
const NUMBER_ONLY = new Set(["seed", "width", "height"]);
const PRESET_GROUPS = [n => n.startsWith("newsprint") || n.startsWith("sky-dither"), n => n.startsWith("bw-"), () => true];

const S = { schema: null, presets: [], media: null, look: {}, base: {}, preset: null, time: 0, thumbs: {},
  zoom: "fit", z: 1, x: 0, y: 0, nat: [0, 0], compare: false, split: 0.5, cam: null };

// ---- toasts and status -------------------------------------------------------------------
function toast(html, kind = "", ms = 3500) {
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = html;
  $("#toasts").append(t); if (ms) setTimeout(() => t.remove(), ms); return t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function status(msg, kind = "") { const el = $("#st-msg"); el.textContent = msg; el.className = kind; }
let spinTimer = 0;
function busy(on, text = "rendering") {
  $("#busy").classList.toggle("on", on); $("#busyText").textContent = text;
  clearInterval(spinTimer);
  if (on) { const f = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"; let i = 0; spinTimer = setInterval(() => $("#spin").textContent = f[i++ % f.length], 80); }
}

// ---- settings model -----------------------------------------------------------------------
const defaults = () => Object.fromEntries(S.schema.fields.map(f => [f.name, f.default]));
function changed(look = S.look) {
  const d = defaults(); const out = {};
  for (const k in look) if (look[k] !== d[k]) out[k] = look[k];
  return out;
}
function applyPreset(name, extra = null) {
  const p = S.presets.find(p => p.name === name);
  S.preset = name; S.base = { ...defaults(), ...(p ? p.settings : extra || {}) }; S.look = { ...S.base };
  buildSettings(); markLooks(); scheduleRender();
}
function setValue(name, v) {
  S.look[name] = v; refreshField(name);
  if (name === "effect" || name === "cells") buildSettings();
  scheduleRender();
}

// ---- shuffle: a random look, nudged ---------------------------------------------------------
const pick = a => a[Math.floor(Math.random() * a.length)];
const INKS = ["#ff4f00", "#2f6bff", "#12a37f", "#e8344e", "#7a4dff", "#161616", "#0078bf", "#3a3a3c"];
const PAPERS = ["#ffffff", "#f6f1e4", "#f3efe6", "#eef3f8", "#fdf1f4"];
function shuffle() {
  const p = pick(S.presets); applyPreset(p.name);
  const L = S.look; const r = (a, b) => a + Math.random() * (b - a);
  if (L.cells) L.cells = Math.round(L.cells * r(0.6, 1.5));
  else if (L.effect === "halftone") L.cell = +(L.cell * r(0.7, 1.5)).toFixed(1);
  L.contrast = +(L.contrast * r(0.9, 1.25)).toFixed(2);
  if (L.effect === "halftone") L.angle = pick([0, 15, 22.5, 30, 45, 60, 75]);
  if (L.mode === "mono" && Math.random() < 0.6) { L.ink = pick(INKS); L.paper = pick(PAPERS); }
  if (Math.random() < 0.25) L.roughness = +r(0.1, 0.5).toFixed(2);
  if (Math.random() < 0.2) L.grain = +r(0.1, 0.5).toFixed(2);
  buildSettings(); markLooks(); scheduleRender(0);
  toast(`shuffled from ${esc(p.name)}`, "", 1800);
}

// ---- settings: the drawer, plus a few in the bottom bar -------------------------------------
function quickNames() {
  const size = S.look.cells ? "cells" : S.look.effect === "dither" ? "pixel" : "cell";
  return [size, "contrast", "brightness", "ink", "paper"];
}
function buildSettings() {
  const root = $("#settings"); root.innerHTML = "";
  const q = $("#search").value.trim().toLowerCase();
  const hidden = HIDE[S.look.effect];
  const groups = {};
  for (const f of S.schema.fields) {
    if (f.group === hidden || f.name === "effect") continue;
    if (q && !(f.name.includes(q.replace(/ /g, "_")) || f.help.toLowerCase().includes(q))) continue;
    (groups[f.group] ||= []).push(f);
  }
  for (const [g, list] of Object.entries(groups)) {
    const det = document.createElement("details"); det.className = "grp"; det.dataset.group = g;
    det.open = q !== "" || ["tone", "colors", "halftone", "dither"].includes(g);
    det.innerHTML = `<summary>${GROUP_NAMES[g] || g}<span class="count"></span></summary><div class="grp-body"></div>`;
    for (const f of list) det.querySelector(".grp-body").append(fieldEl(f));
    root.append(det);
  }
  const quick = $("#quick"); quick.innerHTML = "";
  for (const n of quickNames()) { const f = S.schema.fields.find(f => f.name === n); if (f) quick.append(fieldEl(f)); }
  $$("#effectSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.look.effect));
  updateCounts();
}
function fieldEl(f) {
  const row = document.createElement("div"); row.className = "field"; row.dataset.name = f.name;
  row.title = f.help;
  const label = document.createElement("label"); label.textContent = f.name.replace(/_/g, "-");
  label.onclick = () => { if (row.classList.contains("changed")) setValue(f.name, S.base[f.name]); };
  const ctl = document.createElement("div"); ctl.className = "ctl";
  if (f.type === "bool") {
    const sw = document.createElement("button"); sw.className = "switch"; sw.onclick = () => setValue(f.name, !S.look[f.name]);
    ctl.append(sw);
  } else if (f.choices.length) {
    const sel = document.createElement("select");
    sel.innerHTML = f.choices.map(c => `<option>${esc(c)}</option>`).join("");
    sel.onchange = () => setValue(f.name, sel.value); ctl.append(sel);
  } else if (f.color) {
    const pickEl = document.createElement("input"); pickEl.type = "color";
    const txt = document.createElement("input"); txt.className = "text"; txt.style.flex = "1";
    pickEl.oninput = () => setValue(f.name, pickEl.value);
    txt.onchange = () => setValue(f.name, txt.value.trim());
    ctl.append(pickEl, txt);
    if (f.none_ok) {
      const none = document.createElement("label"); none.className = "none-tag";
      none.innerHTML = `<input type="checkbox"> none`;
      none.querySelector("input").onchange = e => setValue(f.name, e.target.checked ? "none" : (f.default === "none" ? "#ffffff" : f.default));
      ctl.append(none);
    }
  } else if ((f.type === "int" || f.type === "float") && NUMBER_ONLY.has(f.name)) {
    const num = document.createElement("input"); num.className = "num"; num.type = "number"; num.step = f.step;
    num.style.width = "100%"; num.style.textAlign = "left"; num.onchange = () => { if (num.value !== "") setValue(f.name, Math.round(+num.value)); };
    ctl.append(num);
  } else if (f.type === "int" || f.type === "float") {
    const range = document.createElement("input"); range.type = "range";

  buildSettings(); buildLooks(); buildExportMenu(); setMedia(init.media);
  if (init.mode === "webcam" || location.hash === "#webcam") startCam();
})();
</script>
