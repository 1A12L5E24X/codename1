<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotfx</title>
<style>
:root {
  --bg: #13141c; --panel: #1b1d29; --panel2: #222536; --line: #2e3248; --line2: #3a3f5c;
  --text: #d5daf2; --muted: #7a81a6; --accent: #7aa2f7; --accent2: #2d3a5e; --good: #9ece6a;
  --bad: #f7768e; --warn: #e0af68; --radius: 10px;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-rows: 52px 1fr 30px; grid-template-columns: 340px 1fr; height: 100vh; }

/* top bar */
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .3px;
  background: var(--accent); color: #12131c; padding: 5px 11px; border-radius: 7px; }
.logo svg { display: block; }
.file { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px;
  background: var(--panel2); color: var(--muted); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line2); background: var(--panel2); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #12131c; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
.btn .k { font: 11px var(--mono); color: var(--muted); }
.btn.primary .k { color: #2a3150; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 38px; min-width: 210px; z-index: 30; padding: 6px;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 12px 36px #0008; display: none; }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; width: 100%; justify-content: space-between; gap: 12px; padding: 7px 10px;
  border: 0; background: none; border-radius: 6px; text-align: left; }
.menu-list button:hover { background: var(--accent2); }
.menu-list small { color: var(--muted); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }

/* sidebar */
aside { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 10px 10px 0; }
.tab { flex: 1; padding: 7px; border: 0; border-radius: 8px 8px 0 0; background: none; color: var(--muted); font-weight: 600; }
.tab.on { background: var(--panel2); color: var(--text); }
.pane { flex: 1; overflow: auto; background: var(--panel2); margin: 0 10px 10px; border-radius: 0 0 10px 10px; padding: 10px; display: none; }
.pane.on { display: block; }
.pane::-webkit-scrollbar { width: 9px; } .pane::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 9px; }

.group-title { display: flex; align-items: center; gap: 8px; margin: 14px 2px 8px; color: var(--accent);
  font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group-title:first-child { margin-top: 2px; }
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.look { position: relative; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: var(--bg);
  padding: 0; aspect-ratio: 1 / 1; }
.look img { width: 100%; height: 100%; object-fit: cover; display: block; }
.look span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 7px 5px; font-size: 11.5px; font-weight: 600;
  text-align: left; background: linear-gradient(transparent, #000c); color: #fff; }
.look:hover { border-color: var(--line2); }
.look.on { border-color: var(--accent); box-shadow: 0 0 0 3px #7aa2f733; }
.look .ph { width: 100%; height: 100%; background: repeating-linear-gradient(45deg, #1d2030 0 6px, #232741 6px 12px); }

.search { width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); }
.seg { display: grid; grid-auto-flow: column; gap: 3px; padding: 3px; border-radius: 9px; background: var(--panel); margin: 10px 0 2px; }
.seg button { border: 0; border-radius: 7px; padding: 6px; background: none; color: var(--muted); font-weight: 600; }
.seg button.on { background: var(--accent); color: #12131c; }
details.grp { border-top: 1px solid var(--line); }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 2px; cursor: pointer;
  color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.grp[open] summary::before { transform: rotate(90deg); }
details.grp summary .count { margin-left: auto; color: var(--warn); font-weight: 600; letter-spacing: 0; text-transform: none; }
.field { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 6px 10px; padding: 4px 2px; }
.field label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
.field.changed label { color: var(--text); }
.field.changed label::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--warn); flex: none; cursor: pointer; }
.field .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.field input.num { width: 64px; height: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); font-family: var(--mono); font-size: 12px; }
.field select, .field input.text { width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
.field input[type=color] { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 1px; }
.switch { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--line2); border: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 7px; background: #cfd5ee; transition: left .15s; }
.switch.on { background: var(--accent); } .switch.on::after { left: 19px; background: #12131c; }
.none-tag { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.side-foot { display: flex; gap: 6px; padding: 0 10px 10px; }
.side-foot .btn { flex: 1; justify-content: center; height: 30px; font-size: 12px; }

/* stage */
.stage { grid-row: 2; position: relative; overflow: hidden; background:
  radial-gradient(circle at 1px 1px, #ffffff0c 1px, transparent 0) 0 0 / 14px 14px, var(--bg); }
.viewport { position: absolute; inset: 0; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 10px 50px #000a; }
.canvas img { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.canvas.pixel img { image-rendering: pixelated; }
.canvas .checker { position: absolute; inset: 0; background: repeating-conic-gradient(#d8d8d8 0 25%, #f4f4f4 0 50%) 0 0 / 16px 16px; }
#before { clip-path: inset(0 50% 0 0); display: none; }
.compare #before { display: block; }
.split { position: absolute; top: 0; bottom: 0; width: 0; display: none; z-index: 5; }
.compare .split { display: block; }
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: #fff; box-shadow: 0 0 6px #0008; }
.split i { position: absolute; top: 50%; left: -16px; width: 32px; height: 32px; margin-top: -16px; border-radius: 16px;
  background: #fff; color: #12131c; display: grid; place-items: center; font-style: normal; font-weight: 700; cursor: ew-resize; box-shadow: 0 2px 10px #0008; }
.tag { position: absolute; bottom: 14px; padding: 3px 8px; border-radius: 6px; background: #000a; color: #fff; font-size: 11px; font-weight: 600; z-index: 6; display: none; }
.compare .tag { display: block; }
.tools { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; z-index: 10; }
.tools .btn { height: 30px; padding: 0 10px; background: #1b1d29e6; backdrop-filter: blur(8px); }
.busy { position: absolute; left: 14px; top: 14px; z-index: 10; display: none; align-items: center; gap: 8px;
  padding: 6px 11px; border-radius: 8px; background: #1b1d29e6; color: var(--muted); }
.busy.on { display: flex; }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent); animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.timeline { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(640px, 80%); z-index: 10;
  display: none; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; background: #1b1d29ee; border: 1px solid var(--line2); }
.timeline.on { display: flex; }
.timeline input { flex: 1; accent-color: var(--accent); }
.timeline span { font: 12px var(--mono); color: var(--muted); min-width: 92px; text-align: right; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 4; }
.empty .card { padding: 34px 40px; border: 2px dashed var(--line2); border-radius: 18px; background: #1b1d29bb; max-width: 520px; }
.empty h1 { margin: 14px 0 6px; font-size: 22px; }
.empty p { margin: 0 0 20px; color: var(--muted); }
.empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dropping .empty .card, .dropping::after { border-color: var(--accent); }
.dropping::after { content: "Drop to open"; position: absolute; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px;
  display: grid; place-items: center; font-size: 20px; font-weight: 700; background: #7aa2f71a; z-index: 40; }
.webcam-bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: none; gap: 8px;
  align-items: center; padding: 8px 10px; border-radius: 12px; background: #1b1d29ee; border: 1px solid var(--line2); }
.webcam .webcam-bar { display: flex; white-space: nowrap; }
.rec { color: var(--bad); font-weight: 700; display: none; }
.recording .rec { display: inline; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* status */
footer { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: var(--panel);
  border-top: 1px solid var(--line); color: var(--muted); font: 12px var(--mono); }
footer .ok { color: var(--good); } footer .err { color: var(--bad); }
.toasts { position: fixed; right: 16px; top: 64px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { min-width: 260px; max-width: 420px; padding: 11px 14px; border-radius: 10px; background: var(--panel2);
  border: 1px solid var(--line2); box-shadow: 0 10px 30px #0009; }
.toast.ok { border-left: 4px solid var(--good); } .toast.err { border-left: 4px solid var(--bad); }
.toast ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.toast .bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.toast .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: 52px 46vh 1fr 30px; }
  aside { grid-row: 3; } .stage { grid-row: 2; } header .hide-s { display: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18"><g fill="#12131c">
      <circle cx="3" cy="3" r="2.4"/><circle cx="9" cy="3" r="1.7"/><circle cx="15" cy="3" r="1"/>
      <circle cx="3" cy="9" r="1.7"/><circle cx="9" cy="9" r="1.1"/><circle cx="15" cy="9" r=".6"/>
      <circle cx="3" cy="15" r="1"/><circle cx="9" cy="15" r=".6"/><circle cx="15" cy="15" r=".3"/></g></svg>dotfx</div>
    <div class="file" id="file">no file</div>
    <button class="btn" id="openBtn" title="Open a photo or video (O)">Open <span class="k">O</span></button>
    <button class="btn" id="camBtn" title="Use your webcam (W)">Webcam <span class="k">W</span></button>
    <button class="btn hide-s" id="matchBtn" title="Recreate the look of a reference image">Match a reference…</button>
    <div class="spacer"></div>
    <button class="btn hide-s" id="cmdBtn" title="Copy the equivalent command line">Copy command</button>
    <button class="btn hide-s" id="saveBtn" title="Download these settings as a preset">Save preset</button>
    <div class="menu" id="exportMenu">
      <button class="btn primary" id="exportBtn">Export <span class="k">E</span></button>
      <div class="menu-list" id="exportList"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <input type="file" id="refInput" accept="image/*" hidden>
  </header>

  <aside>
    <div class="tabs"><button class="tab on" data-pane="looks">Looks</button><button class="tab" data-pane="settings">Settings</button></div>
    <div class="pane on" id="pane-looks"><div id="looks"></div></div>
    <div class="pane" id="pane-settings">
      <input class="search" id="search" placeholder="Search settings…  ( / )">
      <div class="seg" id="effectSeg"><button data-v="halftone">Halftone</button><button data-v="dither">Dither</button></div>
      <div id="settings"></div>
    </div>
    <div class="side-foot"><button class="btn" id="resetBtn" title="Back to the preset's values">Reset to preset</button>
      <button class="btn" id="compareBtn2" title="Before / after (C)">Before / after</button></div>
  </aside>

  <section class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas"><div class="checker"></div><img id="after" alt=""><img id="before" alt=""></div>
      <div class="split" id="split"><i>⇆</i></div>
      <div class="tag" id="tagB" style="left:14px">before</div><div class="tag" id="tagA" style="right:14px">after</div>
    </div>
    <div class="busy" id="busy"><div class="spin"></div><span id="busyText">rendering…</span></div>
    <div class="tools">
      <button class="btn" id="compareBtn" title="Before / after (C)">Before / after</button>
      <button class="btn" data-zoom="fit" title="Fit (F)">Fit</button>
      <button class="btn" data-zoom="1" title="Actual pixels (1)">1:1</button>
      <button class="btn" data-zoom="2" title="2× (2)">2×</button>
    </div>
    <div class="timeline" id="timeline"><input type="range" id="time" min="0" max="1" step="0.04" value="0"><span id="timeLabel">0.0 / 0.0 s</span></div>
    <div class="webcam-bar"><span class="rec" id="recDot">● REC</span><span id="camFps" style="font:12px var(--mono);color:var(--muted)">—</span>
      <button class="btn" id="snapBtn">Snapshot</button><button class="btn" id="recBtn">Record</button><button class="btn" id="camStop">Stop camera</button></div>
    <div class="empty" id="empty"><div class="card">
      <svg width="64" height="64" viewBox="0 0 18 18"><g fill="#7aa2f7"><circle cx="3" cy="3" r="2.4"/><circle cx="9" cy="3" r="1.7"/><circle cx="15" cy="3" r="1"/>
      <circle cx="3" cy="9" r="1.7"/><circle cx="9" cy="9" r="1.1"/><circle cx="15" cy="9" r=".6"/><circle cx="3" cy="15" r="1"/><circle cx="9" cy="15" r=".6"/><circle cx="15" cy="15" r=".3"/></g></svg>
      <h1>Drop a photo or video</h1><p>…or open one, use your webcam, or try the sample.</p>
      <div class="row"><button class="btn primary" id="openBtn2">Open a file</button><button class="btn" id="camBtn2">Use webcam</button><button class="btn" id="sampleBtn">Try the sample</button></div>
    </div></div>
    <video id="video" playsinline muted hidden></video>
    <canvas id="grab" hidden></canvas>
  </section>
  <footer><span id="st-render">—</span><span id="st-size"></span><span id="st-msg"></span><span style="margin-left:auto" id="st-preset"></span></footer>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Dotfx-Token": TOKEN, ...(opts.headers || {}) } });
async function apiJSON(path, body) {
  const r = await api(path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const GROUP_NAMES = { effect: "Effect", size: "Size", tone: "Tone", colors: "Colors", halftone: "Halftone screen",
  dither: "Dither", texture: "Print texture", mask: "Mask", clipping: "Paper clipping" };
const HIDE = { halftone: "dither", dither: "halftone" };
const NUMBER_ONLY = new Set(["seed", "width", "height"]);
const PRESET_GROUPS = [["Reference looks", n => n.startsWith("newsprint") || n.startsWith("sky-dither")],
  ["Black & white, mostly white", n => n.startsWith("bw-")], ["More looks", () => true]];

const S = { schema: null, presets: [], media: null, look: {}, base: {}, preset: null, time: 0,
  zoom: "fit", z: 1, x: 0, y: 0, nat: [0, 0], compare: false, split: 0.5, cam: null };

// ---- toasts & status -------------------------------------------------------------
function toast(html, kind = "", ms = 4200) {
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = html;
  $("#toasts").append(t); if (ms) setTimeout(() => t.remove(), ms); return t;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function status(msg, kind = "") { const el = $("#st-msg"); el.textContent = msg; el.className = kind; }

// ---- settings model -----------------------------------------------------------------
const defaults = () => Object.fromEntries(S.schema.fields.map(f => [f.name, f.default]));
function changed(look = S.look) {
  const d = defaults(); const out = {};
  for (const k in look) if (look[k] !== d[k]) out[k] = look[k];
  return out;
}
function applyPreset(name, extra = null) {
  const p = S.presets.find(p => p.name === name);
  S.preset = name; S.base = { ...defaults(), ...(p ? p.settings : extra || {}) }; S.look = { ...S.base };
  buildSettings(); markLooks(); scheduleRender(); $("#st-preset").textContent = name ? "preset · " + name : "";
}
function setValue(name, v) { S.look[name] = v; refreshField(name); if (name === "effect") buildSettings(); scheduleRender(); }

// ---- settings panel --------------------------------------------------------------------
function buildSettings() {
  const root = $("#settings"); root.innerHTML = "";
  const q = $("#search").value.trim().toLowerCase();
  const hidden = HIDE[S.look.effect];
  const groups = {};
  for (const f of S.schema.fields) {
    if (f.group === hidden || f.name === "effect") continue;
    if (q && !(f.name.includes(q.replace(/ /g, "_")) || f.help.toLowerCase().includes(q))) continue;
    (groups[f.group] ||= []).push(f);
  }
  for (const [g, list] of Object.entries(groups)) {
    const det = document.createElement("details"); det.className = "grp"; det.dataset.group = g;
    det.open = q !== "" || ["effect", "tone", "colors", "halftone", "dither", "size"].includes(g);
    det.innerHTML = `<summary>${GROUP_NAMES[g] || g}<span class="count"></span></summary>`;
    for (const f of list) det.append(fieldEl(f));
    root.append(det);
  }
  $$("#effectSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.look.effect));
  updateCounts();
}
function fieldEl(f) {
  const row = document.createElement("div"); row.className = "field"; row.dataset.name = f.name;
  row.title = f.help;
  const label = document.createElement("label"); label.textContent = f.name.replace(/_/g, "-");
  label.onclick = e => { if (e.offsetX < 10 && row.classList.contains("changed")) setValue(f.name, S.base[f.name]); };
  const ctl = document.createElement("div"); ctl.className = "ctl";
  const v = S.look[f.name];
  if (f.type === "bool") {
    const sw = document.createElement("button"); sw.className = "switch"; sw.onclick = () => setValue(f.name, !S.look[f.name]);
    ctl.append(sw);
  } else if (f.choices.length) {
    const sel = document.createElement("select");
    sel.innerHTML = f.choices.map(c => `<option>${esc(c)}</option>`).join("");
    sel.onchange = () => setValue(f.name, sel.value); ctl.append(sel);
  } else if (f.color) {
    const pick = document.createElement("input"); pick.type = "color";
    const txt = document.createElement("input"); txt.className = "text"; txt.style.flex = "1";
    pick.oninput = () => setValue(f.name, pick.value);
    txt.onchange = () => setValue(f.name, txt.value.trim());
    ctl.append(pick, txt);
    if (f.none_ok) {
      const none = document.createElement("label"); none.className = "none-tag";
      none.innerHTML = `<input type="checkbox"> none`;
      none.querySelector("input").onchange = e => setValue(f.name, e.target.checked ? "none" : (f.default === "none" ? "#ffffff" : f.default));
      ctl.append(none);
    }
  } else if ((f.type === "int" || f.type === "float") && NUMBER_ONLY.has(f.name)) {
    const num = document.createElement("input"); num.className = "num"; num.type = "number"; num.step = f.step;
    num.style.width = "100%"; num.onchange = () => { if (num.value !== "") setValue(f.name, Math.round(+num.value)); };
    ctl.append(num);
  } else if (f.type === "int" || f.type === "float") {
    const range = document.createElement("input"); range.type = "range";
    range.min = f.min; range.max = f.max; range.step = f.step;
    const num = document.createElement("input"); num.className = "num"; num.type = "number"; num.step = f.step;
    const cast = x => f.type === "int" ? Math.round(+x) : +x;
    range.oninput = () => setValue(f.name, cast(range.value));
    num.onchange = () => { if (num.value !== "") setValue(f.name, cast(num.value)); };
    ctl.append(range, num);
  } else {
    const txt = document.createElement("input"); txt.className = "text";
    const list = f.name === "palette" ? Object.keys(S.schema.palettes) : f.name === "background"
      ? ["original", "paper", "none", ...S.presets.map(p => p.name)] : f.name === "mask" ? ["bright", "dark", "colorful", "center"] : null;
    if (list) { const id = "dl-" + f.name; txt.setAttribute("list", id);
      ctl.insertAdjacentHTML("beforeend", `<datalist id="${id}">${list.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`); }
    txt.onchange = () => setValue(f.name, txt.value);
    ctl.prepend(txt);
  }
  row.append(label, ctl); setTimeout(() => refreshField(f.name, row));
  return row;
}
function hexOf(v) {
  if (!v || v === "none") return "#ffffff";
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v)) return "#" + [...v.slice(1)].map(c => c + c).join("");
  return S.schema.named_colors[v.toLowerCase()] || "#808080";
}
function refreshField(name, row = $(`.field[data-name="${name}"]`)) {
  if (!row) return;
  const f = S.schema.fields.find(f => f.name === name); const v = S.look[name];
  row.classList.toggle("changed", v !== S.base[name]);
  if (f.type === "bool") row.querySelector(".switch").classList.toggle("on", !!v);
  else if (f.choices.length) row.querySelector("select").value = v;
  else if (f.color) { row.querySelector("input[type=color]").value = hexOf(v); row.querySelector(".text").value = v;
    const n = row.querySelector(".none-tag input"); if (n) n.checked = v === "none"; }
  else if (f.type === "int" || f.type === "float") { const rg = row.querySelector("input[type=range]"); if (rg) rg.value = v;
    const num = row.querySelector(".num"); if (document.activeElement !== num) num.value = +(+v).toFixed(4); }
  else row.querySelector(".text").value = v;
  updateCounts();
}
function updateCounts() {
  for (const det of $$("details.grp")) {
    const n = $$(".field.changed", det).length;
    det.querySelector(".count").textContent = n ? `${n} changed` : "";
  }
}

// ---- looks gallery -----------------------------------------------------------------------
function buildLooks(thumbs = {}) {
  const root = $("#looks"); root.innerHTML = ""; const seen = new Set();
  for (const [title, member] of PRESET_GROUPS) {
    const names = S.presets.map(p => p.name).filter(n => !seen.has(n) && member(n)); if (!names.length) continue;
    names.forEach(n => seen.add(n));
    root.insertAdjacentHTML("beforeend", `<div class="group-title">${title}</div>`);
    const grid = document.createElement("div"); grid.className = "looks";
    for (const n of names) {
      const p = S.presets.find(p => p.name === n);
      const b = document.createElement("button"); b.className = "look"; b.dataset.preset = n; b.title = p.description;
      b.innerHTML = (thumbs[n] ? `<img src="${thumbs[n]}" alt="">` : `<div class="ph"></div>`) + `<span>${esc(n)}</span>`;
      b.onclick = () => applyPreset(n); grid.append(b);
    }
    root.append(grid);
  }
  markLooks();
}
function markLooks() { $$(".look").forEach(b => b.classList.toggle("on", b.dataset.preset === S.preset)); }
async function loadThumbs() {
  if (!S.media) return;
  const id = S.media.id;
  try { const list = await apiJSON("/api/thumbs", { media: id, time: 0 });
    if (S.media && S.media.id === id) buildLooks(Object.fromEntries(list.map(t => [t.preset, t.src]))); }
  catch (e) { status(e.message, "err"); }
}

// ---- rendering --------------------------------------------------------------------------
let renderTimer = 0, inflight = false, pending = false, seq = 0, lastURL = "", beforeURL = "", beforeKey = "";
function scheduleRender(delay = 110) { if (S.cam) return; clearTimeout(renderTimer); renderTimer = setTimeout(doRender, delay); }
async function doRender() {
  if (!S.media) return;
  if (inflight) { pending = true; return; }
  inflight = true; pending = false; const my = ++seq; $("#busy").classList.add("on");
  try {
    const r = await api("/api/render", { method: "POST", body: JSON.stringify({ media: S.media.id, settings: changed(), time: S.time }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob(); if (my !== seq) return;
    const url = URL.createObjectURL(blob); const img = $("#after");
    await new Promise(res => { img.onload = res; img.src = url; });
    if (lastURL) URL.revokeObjectURL(lastURL); lastURL = url;
    const [w, h] = r.headers.get("X-Size").split("x").map(Number); const k = +r.headers.get("X-Scale");
    const first = S.nat[0] !== w || S.nat[1] !== h; S.nat = [w, h]; if (first) layout();
    $("#st-render").innerHTML = `<span class="ok">✓</span> ${r.headers.get("X-Render-Ms")} ms`;
    $("#st-size").textContent = `${w}×${h}` + (k < 1 ? `  (preview at ${Math.round(k * 100)}%, export is full size)` : "");
    status(""); loadBefore();
  } catch (e) { status("✗ " + e.message, "err"); }
  finally { inflight = false; $("#busy").classList.remove("on"); if (pending) doRender(); }
}
async function loadBefore() {
  const s = changed(); const key = [S.media.id, S.time, s.width, s.height, s.scale].join("|");
  if (key === beforeKey) return; beforeKey = key;
  const sizing = Object.fromEntries(Object.entries(s).filter(([k]) => ["width", "height", "scale"].includes(k)));
  const r = await api(`/api/original?media=${S.media.id}&time=${S.time}&s=${encodeURIComponent(JSON.stringify(sizing))}`);
  if (!r.ok) return; const url = URL.createObjectURL(await r.blob());
  $("#before").src = url; if (beforeURL) URL.revokeObjectURL(beforeURL); beforeURL = url;
}

// ---- viewport ---------------------------------------------------------------------------
function layout() {
  const vp = $("#viewport").getBoundingClientRect(); const [w, h] = S.nat; if (!w) return;
  if (S.zoom === "fit") { S.z = Math.min((vp.width - 48) / w, (vp.height - 48) / h, 4); S.x = (vp.width - w * S.z) / 2; S.y = (vp.height - h * S.z) / 2; }
  apply();
}
function apply() {
  const c = $("#canvas"); const [w, h] = S.nat;
  c.style.width = w + "px"; c.style.height = h + "px";
  c.style.transform = `translate(${S.x}px, ${S.y}px) scale(${S.z})`;
  c.classList.toggle("pixel", S.z >= 1.5);
  const sx = S.x + w * S.z * S.split; $("#split").style.left = sx + "px";
  $("#before").style.clipPath = `inset(0 ${(1 - S.split) * 100}% 0 0)`;
  $$("[data-zoom]").forEach(b => b.classList.toggle("on", String(S.zoom) === b.dataset.zoom));
}
function zoomTo(z, cx, cy) {
  const vp = $("#viewport").getBoundingClientRect();
  cx ??= vp.width / 2; cy ??= vp.height / 2;
  const k = z / S.z; S.x = cx - (cx - S.x) * k; S.y = cy - (cy - S.y) * k; S.z = z; S.zoom = z; apply();
}
function setZoom(v) {
  if (v === "fit") { S.zoom = "fit"; layout(); return; }
  zoomTo(+v); S.zoom = v;
  const vp = $("#viewport").getBoundingClientRect(); const [w, h] = S.nat;
  if (w * S.z < vp.width) S.x = (vp.width - w * S.z) / 2; if (h * S.z < vp.height) S.y = (vp.height - h * S.z) / 2; apply();
}
(() => {
  const vp = $("#viewport"); let drag = null;
  vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect();
    const z = Math.min(Math.max(S.z * Math.exp(-e.deltaY * 0.0015), 0.05), 16); zoomTo(z, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  vp.addEventListener("pointerdown", e => {
    const r = vp.getBoundingClientRect();
    const onSplit = S.compare && e.target.closest(".split");
    drag = { x: e.clientX, y: e.clientY, ox: S.x, oy: S.y, split: !!onSplit, r };
    vp.setPointerCapture(e.pointerId); vp.classList.add("drag"); });
  vp.addEventListener("pointermove", e => { if (!drag) return;
    if (drag.split) { S.split = Math.min(Math.max((e.clientX - drag.r.left - S.x) / (S.nat[0] * S.z), 0), 1); apply(); return; }
    S.x = drag.ox + e.clientX - drag.x; S.y = drag.oy + e.clientY - drag.y; if (S.zoom === "fit") S.zoom = S.z; apply(); });
  vp.addEventListener("pointerup", () => { drag = null; vp.classList.remove("drag"); });
  vp.addEventListener("dblclick", () => setZoom(S.zoom === "fit" ? "1" : "fit"));
  addEventListener("resize", () => { if (S.zoom === "fit") layout(); else apply(); });
})();
function toggleCompare() { S.compare = !S.compare; $("#viewport").classList.toggle("compare", S.compare);
  $("#compareBtn").classList.toggle("on", S.compare); $("#compareBtn2").classList.toggle("on", S.compare); apply(); }

// ---- media -----------------------------------------------------------------------------
function setMedia(m) {
  S.media = m; S.time = 0; S.nat = [0, 0]; S.zoom = "fit"; beforeKey = "";
  $("#empty").style.display = m ? "none" : "";
  $("#file").innerHTML = m ? `<b>${esc(m.name)}</b> ${m.width}×${m.height}${m.kind === "video" ? ` · ${m.duration.toFixed(1)} s` : ""}` : "no file";
  const tl = $("#timeline"); tl.classList.toggle("on", !!m && m.kind === "video");
  if (m && m.kind === "video") { const t = $("#time"); t.max = Math.max(m.duration - 1 / m.fps, 0); t.step = 1 / m.fps; t.value = 0; timeLabel(); }
  buildExportMenu(); buildLooks(); if (m) { scheduleRender(0); loadThumbs(); }
}
function timeLabel() { $("#timeLabel").textContent = `${S.time.toFixed(2)} / ${S.media.duration.toFixed(1)} s`; }
$("#time").oninput = e => { S.time = +e.target.value; timeLabel(); scheduleRender(60); };
async function openFile(file) {
  if (!file) return; stopCam();
  const t = toast(`Opening <b>${esc(file.name)}</b>…`, "", 0);
  try { const r = await api(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const j = await r.json(); if (!r.ok) throw new Error(j.error); setMedia(j); t.remove(); }
  catch (e) { t.remove(); toast("✗ " + esc(e.message), "err"); }
}
$("#fileInput").onchange = e => openFile(e.target.files[0]);
for (const id of ["#openBtn", "#openBtn2"]) $(id).onclick = () => $("#fileInput").click();
$("#sampleBtn").onclick = async () => setMedia(await apiJSON("/api/sample"));
(() => { let n = 0; const st = $("#app");
  addEventListener("dragenter", e => { e.preventDefault(); n++; st.classList.add("dropping"); });
  addEventListener("dragleave", () => { if (--n <= 0) { n = 0; st.classList.remove("dropping"); } });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => { e.preventDefault(); n = 0; st.classList.remove("dropping"); openFile(e.dataTransfer.files[0]); }); })();

// ---- export / preset / command / match -------------------------------------------------------
function buildExportMenu() {
  const v = S.media && S.media.kind === "video";
  const items = [["png", "PNG image", "lossless"], ["jpg", "JPEG image", ""], ["svg", "SVG vector", "real dots"], ["pdf", "PDF vector", "for print"]];
  if (v) items.push(null, ["mp4", "MP4 video", "with audio"], ["webm", "WebM video", ""], ["gif", "GIF", "loops"]);
  $("#exportList").innerHTML = items.map(i => i ? `<button data-fmt="${i[0]}">${i[1]} <small>${i[2]}</small></button>` : "<hr>").join("")
    + (v ? "" : "") ;
  $$("#exportList button").forEach(b => b.onclick = () => { $("#exportMenu").classList.remove("open"); exportAs(b.dataset.fmt); });
}
$("#exportBtn").onclick = e => { e.stopPropagation(); $("#exportMenu").classList.toggle("open"); };
addEventListener("click", () => $("#exportMenu").classList.remove("open"));
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function exportAs(fmt) {
  if (!S.media) return toast("Open something first", "err");
  const body = JSON.stringify({ media: S.media.id, settings: changed(), format: fmt, time: S.time });
  if (["mp4", "webm", "gif"].includes(fmt)) {
    const t = toast(`Rendering <b>${fmt.toUpperCase()}</b>… <span class="pct">0%</span><div class="bar"><i></i></div>`, "", 0);
    try { const r = await api("/api/export", { method: "POST", body }); const job = await r.json(); if (!r.ok) throw new Error(job.error);
      while (true) { await new Promise(res => setTimeout(res, 500)); const j = await apiJSON(`/api/job/${job.id}`);
        const pct = j.total ? Math.min(100, Math.round(j.done / j.total * 100)) : 0;
        $(".bar i", t).style.width = pct + "%"; $(".pct", t).textContent = `${pct}% · ${j.done}${j.total ? "/" + j.total : ""} frames`;
        if (j.state === "error") throw new Error(j.error);
        if (j.state === "done") { const f = await api(`/api/job/${job.id}/file`); download(await f.blob(), j.name); break; } }
      t.remove(); toast(`✓ Exported video`, "ok"); }
    catch (e) { t.remove(); toast("✗ " + esc(e.message), "err", 8000); }
    return;
  }
  const t = toast(`Exporting <b>${fmt.toUpperCase()}</b> at full size…`, "", 0);
  try { const r = await api("/api/export", { method: "POST", body }); if (!r.ok) throw new Error((await r.json()).error);
    const name = (r.headers.get("Content-Disposition").match(/filename="(.+)"/) || [])[1] || "dotfx." + fmt;
    download(await r.blob(), name); t.remove(); toast(`✓ Saved <b>${esc(name)}</b>`, "ok"); }
  catch (e) { t.remove(); toast("✗ " + esc(e.message), "err"); }
}
$("#saveBtn").onclick = async () => { const r = await api("/api/preset", { method: "POST", body: JSON.stringify({ settings: changed() }) });
  download(await r.blob(), (S.preset || "dotfx-look").replace(/[^\w.-]+/g, "-") + ".toml");
  toast("✓ Preset saved. Use it with <code>dotfx photo.jpg -p FILE.toml</code>", "ok"); };
$("#cmdBtn").onclick = async () => { const j = await apiJSON("/api/command", { media: S.media && S.media.id, settings: changed() });
  try { await navigator.clipboard.writeText(j.command); toast("✓ Command copied<ul><li><code>" + esc(j.command) + "</code></li></ul>", "ok", 7000); }
  catch { toast("<code>" + esc(j.command) + "</code>", "", 12000); } };
$("#matchBtn").onclick = () => $("#refInput").click();
$("#refInput").onchange = async e => {
  const file = e.target.files[0]; if (!file) return; e.target.value = "";
  const t = toast(`Measuring <b>${esc(file.name)}</b>… <div class="bar"><i style="width:60%"></i></div>`, "", 0);
  try { const r = await api(`/api/match?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    S.preset = "matched: " + file.name; S.base = { ...defaults(), ...j.settings }; S.look = { ...S.base };
    buildSettings(); markLooks(); scheduleRender(0); $("#st-preset").textContent = "preset · " + S.preset;
    t.remove(); toast(`✓ Matched <b>${esc(file.name)}</b><ul>${j.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`, "ok", 12000); }
  catch (e) { t.remove(); toast("✗ " + esc(e.message), "err", 8000); }
};
$("#resetBtn").onclick = () => { S.look = { ...S.base }; buildSettings(); scheduleRender(0); };
$("#compareBtn").onclick = toggleCompare; $("#compareBtn2").onclick = toggleCompare;
$$("[data-zoom]").forEach(b => b.onclick = () => setZoom(b.dataset.zoom));
$$(".tab").forEach(b => b.onclick = () => { $$(".tab").forEach(x => x.classList.toggle("on", x === b));
  $$(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.pane)); });
$("#search").oninput = buildSettings;
$$("#effectSeg button").forEach(b => b.onclick = () => setValue("effect", b.dataset.v));

// ---- webcam ------------------------------------------------------------------------------
async function startCam() {
  if (S.cam) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 } }, audio: false }); }
  catch (e) { return toast("✗ Camera unavailable: " + esc(e.message), "err", 7000); }
  const v = $("#video"); v.srcObject = stream; await v.play();
  S.cam = { stream, run: true, frames: [], recorder: null, chunks: [] };
  $("#app").classList.add("webcam"); $("#stage").classList.add("webcam"); $("#empty").style.display = "none";
  $("#camBtn").classList.add("on"); $("#timeline").classList.remove("on");
  $("#file").innerHTML = `<b>webcam</b> ${v.videoWidth}×${v.videoHeight}`;
  // A still for the look thumbnails.
  const still = await grab(480, "image/jpeg");
  api(`/api/upload?name=webcam.jpg`, { method: "POST", body: still }).then(r => r.json()).then(m => { S.media = m; loadThumbs(); buildExportMenu(); });
  camLoop();
}
async function grab(width, type = "image/jpeg") {
  const v = $("#video"), c = $("#grab"); const w = Math.min(width, v.videoWidth); const h = Math.round(v.videoHeight * w / v.videoWidth);
  c.width = w; c.height = h; c.getContext("2d").drawImage(v, 0, 0, w, h);
  return new Promise(res => c.toBlob(res, type, 0.9));
}
let recCanvas = null;
async function camLoop() {
  const img = $("#after"); let last = performance.now();
  while (S.cam && S.cam.run) {
    try {
      const blob = await grab(560);
      const r = await api("/api/frame", { method: "POST", body: blob, headers: { "X-Settings": JSON.stringify(changed()) } });
      if (!r.ok) throw new Error((await r.json()).error);
      const url = URL.createObjectURL(await r.blob());
      await new Promise(res => { img.onload = res; img.src = url; });
      if (lastURL) URL.revokeObjectURL(lastURL); lastURL = url;
      if (S.nat[0] !== img.naturalWidth) { S.nat = [img.naturalWidth, img.naturalHeight]; S.zoom = "fit"; layout(); }
      if (S.cam && S.cam.recorder) { recCanvas.getContext("2d").drawImage(img, 0, 0, recCanvas.width, recCanvas.height); }
      const now = performance.now(); S.cam && S.cam.frames.push(now - last); last = now;
      if (S.cam && S.cam.frames.length > 10) S.cam.frames.shift();
      const avg = S.cam ? S.cam.frames.reduce((a, b) => a + b, 0) / S.cam.frames.length : 0;
      $("#camFps").textContent = `${(1000 / avg).toFixed(1)} fps · ${r.headers.get("X-Render-Ms")} ms render`;
      $("#st-render").innerHTML = `<span class="ok">●</span> live`; $("#st-size").textContent = `${img.naturalWidth}×${img.naturalHeight}`;
    } catch (e) { status("✗ " + e.message, "err"); await new Promise(res => setTimeout(res, 500)); }
  }
}
function stopCam() {
  if (!S.cam) return; S.cam.run = false; if (S.cam.recorder) S.cam.recorder.stop();
  S.cam.stream.getTracks().forEach(t => t.stop()); S.cam = null;
  $("#stage").classList.remove("webcam", "recording"); $("#camBtn").classList.remove("on");
  if (!S.media) $("#empty").style.display = ""; else setMedia(S.media);
}
for (const id of ["#camBtn", "#camBtn2"]) $(id).onclick = () => S.cam ? stopCam() : startCam();
$("#camStop").onclick = stopCam;
$("#snapBtn").onclick = async () => {
  const blob = await grab(4096);
  const r = await api("/api/frame?png=1", { method: "POST", body: blob, headers: { "X-Settings": JSON.stringify(changed()) } });
  download(await r.blob(), `dotfx-snapshot-${Date.now()}.png`); toast("✓ Snapshot saved (full camera resolution)", "ok");
  const s = $("#stage"); s.style.outline = "3px solid var(--good)"; setTimeout(() => s.style.outline = "", 250);
};
$("#recBtn").onclick = () => {
  const cam = S.cam; if (!cam) return;
  if (cam.recorder) { cam.recorder.stop(); return; }
  const img = $("#after"); recCanvas = document.createElement("canvas");
  recCanvas.width = img.naturalWidth - img.naturalWidth % 2; recCanvas.height = img.naturalHeight - img.naturalHeight % 2;
  const rec = new MediaRecorder(recCanvas.captureStream(20), { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
  cam.chunks = []; rec.ondataavailable = e => cam.chunks.push(e.data);
  rec.onstop = () => { download(new Blob(cam.chunks, { type: "video/webm" }), `dotfx-live-${Date.now()}.webm`);
    cam.recorder = null; $("#stage").classList.remove("recording"); $("#recBtn").textContent = "Record"; toast("✓ Recording saved", "ok"); };
  rec.start(500); cam.recorder = rec; $("#stage").classList.add("recording"); $("#recBtn").textContent = "Stop recording";
};

// ---- keyboard ------------------------------------------------------------------------------
addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea")) return;
  const k = e.key;
  if (k === "f" || k === "F") setZoom("fit"); else if (k === "1") setZoom("1"); else if (k === "2") setZoom("2");
  else if (k === "c" || k === "C") toggleCompare(); else if (k === "o" || k === "O") $("#fileInput").click();
  else if (k === "w" || k === "W") (S.cam ? stopCam() : startCam());
  else if (k === "e" || k === "E") { e.stopPropagation(); $("#exportMenu").classList.toggle("open"); }
  else if (k === "/") { e.preventDefault(); $$(".tab")[1].click(); $("#search").focus(); }
  else if (k === "ArrowRight" || k === "ArrowLeft") { const names = S.presets.map(p => p.name);
    const i = names.indexOf(S.preset); applyPreset(names[(i + (k === "ArrowRight" ? 1 : -1) + names.length) % names.length]); }
});

// ---- start ---------------------------------------------------------------------------------
(async () => {
  try {
    [S.schema, S.presets] = await Promise.all([apiJSON("/api/schema"), apiJSON("/api/presets")]);
  } catch (e) { document.body.innerHTML = `<p style="padding:40px">Can't reach dotfx (${esc(e.message)}). Open the link printed in the terminal.</p>`; return; }
  const init = await apiJSON("/api/state");
  S.preset = init.preset; S.base = { ...defaults(), ...(S.presets.find(p => p.name === init.preset) || { settings: {} }).settings };
  S.look = { ...defaults(), ...init.settings };
  if (!init.preset && Object.keys(init.settings).length) S.base = { ...S.look };
  if (!init.preset && !Object.keys(init.settings).length) { const p = S.presets.find(p => p.name === "newsprint"); S.preset = "newsprint"; S.base = { ...defaults(), ...p.settings }; S.look = { ...S.base }; }
  $("#st-preset").textContent = S.preset ? "preset · " + S.preset : "";
  buildSettings(); buildLooks(); buildExportMenu(); setMedia(init.media);
  if (init.mode === "webcam" || location.hash === "#webcam") startCam();
})();
</script>
